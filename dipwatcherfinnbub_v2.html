<script>

/* =====================================================================

===================================================================== */
const MARKETS = [
  { id: 'XAUUSD', name: 'Gold',          oanda: 'XAU_USD',    td: 'XAU/USD', sessions: ['london', 'ny'],      fallbackSpread: 0.40 },
  { id: 'XAGUSD', name: 'Silver',        oanda: 'XAG_USD',    td: 'XAG/USD', sessions: ['london', 'ny'],      fallbackSpread: 0.03 },
  { id: 'WTI',    name: 'Oil (WTI)',     oanda: 'WTICO_USD',  td: 'WTI/USD', sessions: ['ny'],                fallbackSpread: 0.04 },
  { id: 'JP225',  name: 'Japan 225',     oanda: 'JP225_USD',  td: 'N225',    sessions: ['tokyo'],             fallbackSpread: 8 },
  { id: 'HK50',   name: 'Hong Kong 50',  oanda: 'HK33_USD',   td: 'HSI',     sessions: ['hk'],                fallbackSpread: 8 },
  { id: 'CN50',   name: 'China 50',      oanda: 'CN50_USD',   td: 'XIN9',    sessions: ['shanghai', 'hk'],    fallbackSpread: 10 },
  { id: 'NAS100', name: 'Nasdaq 100',    oanda: 'NAS100_USD', td: 'NDX',     sessions: ['ny'],                fallbackSpread: 1.5 },
  { id: 'SPX500', name: 'S&P 500',       oanda: 'SPX500_USD', td: 'SPX',     sessions: ['ny'],                fallbackSpread: 0.5 }
];

// Cross-market drivers (context only, never scored or journaled)
const DRIVERS = [
  { id: 'USDJPY', name: 'USD/JPY',  oanda: 'USD_JPY',     td: 'USD/JPY', note: 'Higher USD/JPY usually supports Japan 225' },
  { id: 'USDCNH', name: 'USD/CNH',  oanda: 'USD_CNH',     td: 'USD/CNH', note: 'Higher = weaker yuan, often risk-off for China 50 / HK 50' },
  { id: 'US10Y',  name: 'US 10Y T-Note (price)', oanda: 'USB10Y_USD', td: null, note: 'Bond price: falling price = rising yield, which tends to pressure gold and silver' }
];

const SESSIONS = {
  tokyo:    { label: 'Tokyo',     tz: 'Asia/Tokyo',       open: [9, 0],  close: [15, 30] },
  hk:       { label: 'Hong Kong', tz: 'Asia/Hong_Kong',   open: [9, 30], close: [16, 0] },
  shanghai: { label: 'Shanghai',  tz: 'Asia/Shanghai',    open: [9, 30], close: [15, 0] },
  london:   { label: 'London',    tz: 'Europe/London',    open: [8, 0],  close: [16, 30] },
  ny:       { label: 'New York',  tz: 'America/New_York', open: [9, 30], close: [16, 0] }
};

const GRAN_MIN = { M1: 1, M5: 5, M15: 15 };
const TD_INTERVAL = { M1: '1min', M5: '5min', M15: '15min' };

const DEFAULTS = {
  provider: 'oanda',        // 'oanda' | 'twelvedata'
  oandaEnv: 'practice',
  oandaToken: '',
  proxyUrl: '',
  tdKey: '',
  gran: 'M15',
  rolloverUtc: 21,          // hour (UTC) when your "trading day" starts. 21 = 5pm New York during US daylight time, 22 in winter
  equity: 10000,
  riskPct: 0.5,
  stopMult: 1,              // stop distance in ATRs
  minScore: 40,             // minimum |lean| for a setup to count as actionable
  expireHours: 4,           // journal entries not resolved by then are closed at market
  refreshSec: 30,
  auto: false,
  drivers: true,
  enabled: Object.fromEntries(MARKETS.map(m => [m.id, true]))
};

const LS = { settings: 'dts2_settings', journal: 'dts2_journal', events: 'dts2_events', cache: 'dts2_cache' };

/*PURE_START*/
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* ---------- indicators ---------- */
function emaLast(vals, n) {
  if (!vals.length) return null;
  const seed = Math.min(n, vals.length);
  const k = 2 / (n + 1);
  let e = avg(vals.slice(0, seed));
  for (let i = seed; i < vals.length; i++) e = vals[i] * k + e * (1 - k);
  return e;
}

function rsiWilder(closes, n = 14) {
  if (closes.length <= n) return null;
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) { const d = closes[i] - closes[i - 1]; if (d > 0) g += d; else l -= d; }
  g /= n; l /= n;
  for (let i = n + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    g = (g * (n - 1) + Math.max(d, 0)) / n;
    l = (l * (n - 1) + Math.max(-d, 0)) / n;
  }
  if (l === 0) return g === 0 ? 50 : 100;
  return 100 - 100 / (1 + g / l);
}

function trueRanges(c) {
  const tr = [];
  for (let i = 1; i < c.length; i++) {
    tr.push(Math.max(c[i].h - c[i].l, Math.abs(c[i].h - c[i - 1].c), Math.abs(c[i].l - c[i - 1].c)));
  }
  return tr;
}

function atrWilder(c, n = 14) {
  const tr = trueRanges(c);
  if (tr.length < n) return null;
  let a = avg(tr.slice(0, n));
  for (let i = n; i < tr.length; i++) a = (a * (n - 1) + tr[i]) / n;
  return a;
}

function adxWilder(c, n = 14) {
  if (c.length < 2 * n + 2) return null;
  const tr = trueRanges(c), pdm = [], ndm = [];
  for (let i = 1; i < c.length; i++) {
    const up = c[i].h - c[i - 1].h, dn = c[i - 1].l - c[i].l;
    pdm.push(up > dn && up > 0 ? up : 0);
    ndm.push(dn > up && dn > 0 ? dn : 0);
  }
  const sum = (a, from, to) => a.slice(from, to).reduce((x, y) => x + y, 0);
  let sTR = sum(tr, 0, n), sP = sum(pdm, 0, n), sN = sum(ndm, 0, n);
  const dx = [];
  const pushDx = () => {
    const pdi = 100 * sP / sTR, ndi = 100 * sN / sTR, s = pdi + ndi;
    dx.push(s === 0 ? 0 : 100 * Math.abs(pdi - ndi) / s);
  };
  pushDx();
  for (let i = n; i < tr.length; i++) {
    sTR = sTR - sTR / n + tr[i];
    sP = sP - sP / n + pdm[i];
    sN = sN - sN / n + ndm[i];
    pushDx();
  }
  if (dx.length < n) return null;
  let adx = avg(dx.slice(0, n));
  for (let i = n; i < dx.length; i++) adx = (adx * (n - 1) + dx[i]) / n;
  return adx;
}

/* ---------- main analysis: candles -> metrics, levels, lean, setup ----------
   candle = { t(ms), o, h, l, c, v, bid, ask }                                  */
function analyze(candles, s, fallbackSpread, nowMs) {
  const gm = GRAN_MIN[s.gran];
  if (candles.length < 60) return { error: 'Only ' + candles.length + ' candles returned (need 60+)' };

  const roll = s.rolloverUtc * 3600000;
  const dayKey = (t) => Math.floor((t - roll) / 86400000);
  const offset = (t) => (((t - roll) % 86400000) + 86400000) % 86400000;

  const last = candles[candles.length - 1];
  const price = last.c;
  const todayKey = dayKey(last.t);

  const days = new Map();
  for (const c of candles) {
    const k = dayKey(c.t);
    if (!days.has(k)) days.set(k, []);
    days.get(k).push(c);
  }
  const today = days.get(todayKey);
  const prevKeys = [...days.keys()].filter(k => k < todayKey).sort((a, b) => b - a);
  const prevComplete = prevKeys.filter(k => days.get(k).length >= 20);

  let pdh = null, pdl = null, pdc = null;
  if (prevComplete.length) {
    const pc = days.get(prevComplete[0]);
    pdh = Math.max(...pc.map(c => c.h));
    pdl = Math.min(...pc.map(c => c.l));
    pdc = pc[pc.length - 1].c;
  }

  const closes = candles.map(c => c.c);
  const atr = atrWilder(candles, 14);
  const rsi = rsiWilder(closes, 14);
  const adx = adxWilder(candles, 14);
  const ema20 = emaLast(closes, 20);
  const ema50 = emaLast(closes, 50);
  if (atr == null || rsi == null || adx == null || atr <= 0) return { error: 'Not enough history for indicators' };

  const dayOpen = today[0].o;
  const dayHigh = Math.max(...today.map(c => c.h));
  const dayLow = Math.min(...today.map(c => c.l));

  // Session VWAP (tick volume weighted). Falls back to a plain typical-price average if no volume.
  let pv = 0, vv = 0, tpSum = 0;
  for (const c of today) { const tp = (c.h + c.l + c.c) / 3; pv += tp * c.v; vv += c.v; tpSum += tp; }
  const vwap = vv > 0 ? pv / vv : tpSum / today.length;

  // Relative volume vs same time of day on up to 5 prior days (cumulative since rollover)
  const curOff = offset(last.t);
  const cum = (k) => days.get(k).reduce((a, c) => offset(c.t) <= curOff ? a + c.v : a, 0);
  const todayCum = cum(todayKey);
  const priorCums = prevComplete
    .filter(k => offset(days.get(k)[0].t) <= 3 * 3600000)   // skip days cut off by the fetch window
    .slice(0, 5).map(cum).filter(x => x > 0);
  const rvol = (priorCums.length >= 2 && todayCum > 0) ? todayCum / avg(priorCums) : null;

  const haveRealSpread = last.ask != null && last.bid != null && last.ask > last.bid;
  const spread = haveRealSpread ? last.ask - last.bid : fallbackSpread;

  /* ----- lean: -100 (short) .. +100 (long), regime-aware ----- */
  const regime = adx >= 22 ? 'Trend' : adx < 20 ? 'Range' : 'Transition';
  const ranging = adx < 20;
  const dev = (price - vwap) / atr;
  const tNorm = clamp((ema20 - ema50) / atr, -1.5, 1.5) / 1.5;
  const strength = clamp((adx - 15) / 20, 0, 1);
  const flip = ranging ? -1 : 1;                             // in a range, stretch = fade; in a trend, stretch = continuation
  const trendPts = 35 * tNorm * (0.4 + 0.6 * strength);
  const vwapPts = flip * 25 * clamp(dev, -2, 2) / 2;
  const momPts = flip * 20 * clamp((price - dayOpen) / atr, -3, 3) / 3;
  const rsiPts = ranging ? -20 * clamp((rsi - 50) / 25, -1, 1) : 10 * clamp((rsi - 50) / 25, -1, 1);
  let lean = trendPts + vwapPts + momPts + rsiPts;

  /* ----- setup classification ----- */
  let setup = 'No setup', dir = 0, entryType = false;
  // Fading an extreme is only allowed when the trend is not strong (ADX < 35); otherwise it is catching a falling knife
  const exhaust = adx < 35 && Math.abs(dev) >= 2.2 && ((dev > 0 && rsi >= 75) || (dev < 0 && rsi <= 25));
  if (exhaust) {
    dir = dev > 0 ? -1 : 1;
    setup = dir > 0 ? 'Exhaustion long' : 'Exhaustion short';
    entryType = true;
    lean = dir * clamp(50 + (Math.abs(dev) - 2.2) * 10 + (Math.abs(rsi - 50) - 25) * 0.8, 50, 100);
  } else if (pdh != null && adx >= 20 && price > pdh && price <= pdh + 1.2 * atr) {
    dir = 1; setup = 'Breakout long'; entryType = true;
  } else if (pdl != null && adx >= 20 && price < pdl && price >= pdl - 1.2 * atr) {
    dir = -1; setup = 'Breakout short'; entryType = true;
  } else if (adx >= 22 && ema20 > ema50 && price > ema50 && (price <= ema20 + 0.25 * atr || rsi <= 45)) {
    dir = 1; setup = 'Pullback long'; entryType = true;
  } else if (adx >= 22 && ema20 < ema50 && price < ema50 && (price >= ema20 - 0.25 * atr || rsi >= 55)) {
    dir = -1; setup = 'Pullback short'; entryType = true;
  } else if (adx < 20 && dev <= -1.5 && rsi < 35) {
    dir = 1; setup = 'Range fade long'; entryType = true;
  } else if (adx < 20 && dev >= 1.5 && rsi > 65) {
    dir = -1; setup = 'Range fade short'; entryType = true;
  } else if (adx >= 22 && ema20 > ema50) {
    dir = 1; setup = 'Trend long (extended)';
  } else if (adx >= 22 && ema20 < ema50) {
    dir = -1; setup = 'Trend short (extended)';
  }
  lean = Math.round(clamp(lean, -100, 100));
  const actionable = entryType && dir !== 0 && Math.sign(lean) === dir && Math.abs(lean) >= s.minScore;

  return {
    price, dayOpen, dayHigh, dayLow, vwap, ema20, ema50, rsi, atr, adx, rvol,
    spread, spreadReal: haveRealSpread, pdh, pdl, pdc,
    lean, setup, dir, entryType, actionable, regime, dev,
    parts: { trend: trendPts, vwap: vwapPts, momentum: momPts, rsi: rsiPts },
    lastT: last.t, fetchedAt: nowMs
  };
}

/* ---------- risk / trade plan ---------- */
function tradePlan(a, s, dir) {
  const risk = s.equity * s.riskPct / 100;
  const R = a.atr * s.stopMult;
  const perUnit = R + a.spread;                       // price risk plus the spread you pay to get in
  const units = Math.floor(risk / perUnit * 100) / 100;
  return {
    risk, R, units,
    entry: a.price, stop: a.price - dir * R,
    t1: a.price + dir * R, t2: a.price + dir * 2 * R,
    spreadCost: units * a.spread, notional: units * a.price
  };
}

/* ---------- journal outcome: -1R at stop, +2R at target, else close at expiry ---------- */
function evalEntry(e, candles, nowMs, expireHours) {
  const R = e.atr * e.stopMult;
  const expireMs = expireHours * 3600000;
  for (const c of candles) {
    if (c.t <= e.lastT) continue;
    const hitStop = e.dir > 0 ? c.l <= e.stop : c.h >= e.stop;
    const hitTarget = e.dir > 0 ? c.h >= e.t2 : c.l <= e.t2;
    if (hitStop) return { ...e, status: 'stop', r: -1, closedAt: c.t };   // if both hit in one candle, assume stop first
    if (hitTarget) return { ...e, status: 'target', r: 2, closedAt: c.t };
    if (c.t - e.ts > expireMs) return { ...e, status: 'expired', r: clamp(e.dir * (c.c - e.entry) / R, -1, 2), closedAt: c.t };
  }
  if (nowMs - e.ts > expireMs && candles.length) {
    const c = candles[candles.length - 1];
    return { ...e, status: 'expired', r: clamp(e.dir * (c.c - e.entry) / R, -1, 2), closedAt: c.t };
  }
  return e;
}

function journalStats(journal) {
  const closed = journal.filter(e => e.status !== 'open');
  const mk = (list) => ({
    n: list.length,
    win: list.length ? list.filter(e => e.r > 0).length / list.length : null,
    avgR: list.length ? avg(list.map(e => e.r)) : null
  });
  return {
    open: journal.length - closed.length,
    all: mk(closed),
    buckets: [
      { label: '40-59', ...mk(closed.filter(e => Math.abs(e.score) < 60)) },
      { label: '60-79', ...mk(closed.filter(e => Math.abs(e.score) >= 60 && Math.abs(e.score) < 80)) },
      { label: '80+',   ...mk(closed.filter(e => Math.abs(e.score) >= 80)) }
    ]
  };
}

/* ---------- sessions (DST-correct via Intl) ---------- */
function tzOffsetMs(tz, t) {
  const p = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
    .formatToParts(new Date(t)).reduce((o, x) => (o[x.type] = x.value, o), {});
  const asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
  return asUtc - Math.floor(t / 1000) * 1000;
}

function sessionInfo(key, nowMs) {
  const s = SESSIONS[key];
  const p = new Intl.DateTimeFormat('en-US', { timeZone: s.tz, year: 'numeric', month: '2-digit', day: '2-digit' })
    .formatToParts(new Date(nowMs)).reduce((o, x) => (o[x.type] = x.value, o), {});
  const y = +p.year, m = +p.month - 1, d = +p.day;
  const toUtc = (hm) => { const g = Date.UTC(y, m, d, hm[0], hm[1]); return g - tzOffsetMs(s.tz, g); };
  const open = toUtc(s.open), close = toUtc(s.close);
  const dow = new Date(Date.UTC(y, m, d)).getUTCDay();
  const weekday = dow !== 0 && dow !== 6;
  return { key, label: s.label, openT: open, closeT: close, isOpen: weekday && nowMs >= open && nowMs < close };
}
/*PURE_END*/

/* ---------- data providers ---------- */
async function fetchOanda(instrument, s, count) {
  const proxy = (s.proxyUrl || '').trim();
  const base = proxy ? proxy.replace(/\/$/, '') : (s.oandaEnv === 'live' ? 'https://api-fxtrade.oanda.com' : 'https://api-fxpractice.oanda.com');
  const headers = proxy ? {} : { Authorization: 'Bearer ' + s.oandaToken.trim() };
  const url = base + '/v3/instruments/' + instrument + '/candles?granularity=' + s.gran + '&count=' + count + '&price=MBA';
  const r = await fetch(url, { headers });
  if (!r.ok) {
    const txt = await r.text().catch(() => '');
    throw new Error('OANDA ' + r.status + (txt ? ': ' + txt.slice(0, 100) : ''));
  }
  const j = await r.json();
  return (j.candles || []).filter(c => c.mid).map(c => ({
    t: Date.parse(c.time), o: +c.mid.o, h: +c.mid.h, l: +c.mid.l, c: +c.mid.c, v: c.volume || 0,
    bid: c.bid ? +c.bid.c : null, ask: c.ask ? +c.ask.c : null
  }));
}

async function fetchTwelveData(symbol, s, count) {
  const url = 'https://api.twelvedata.com/time_series?symbol=' + encodeURIComponent(symbol) +
    '&interval=' + TD_INTERVAL[s.gran] + '&outputsize=' + count + '&timezone=UTC&order=ASC&apikey=' + encodeURIComponent(s.tdKey.trim());
  const r = await fetch(url);
  const j = await r.json();
  if (j.status === 'error' || !j.values) throw new Error('Twelve Data: ' + (j.message || 'no data').slice(0, 120));
  return j.values.map(v => ({
    t: Date.parse(v.datetime.replace(' ', 'T') + 'Z'), o: +v.open, h: +v.high, l: +v.low, c: +v.close, v: +(v.volume || 0), bid: null, ask: null
  })).sort((a, b) => a.t - b.t);
}

/* ---------- storage helpers ---------- */
const loadJSON = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const saveJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage full or blocked */ } };

/* ---------- formatting ---------- */
const fmtPx = (n) => n == null ? '-' : Math.abs(n) >= 10000 ? n.toLocaleString(undefined, { maximumFractionDigits: 1, minimumFractionDigits: 1 })
  : Math.abs(n) >= 100 ? n.toLocaleString(undefined, { maximumFractionDigits: 2, minimumFractionDigits: 2 })
  : n.toLocaleString(undefined, { maximumFractionDigits: 3, minimumFractionDigits: 3 });
const fmtSigned = (n, d = 2) => (n > 0 ? '+' : '') + n.toFixed(d);
const fmtMel = (t) => new Intl.DateTimeFormat('en-AU', { timeZone: 'Australia/Melbourne', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(t));
const fmtMelFull = (t) => new Intl.DateTimeFormat('en-AU', { timeZone: 'Australia/Melbourne', weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).format(new Date(t));
const fmtAge = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); if (s < 90) return s + 's'; const m = Math.round(s / 60); if (m < 120) return m + 'm'; return Math.round(m / 60) + 'h'; };
const staleMs = (s) => Math.max(3 * GRAN_MIN[s.gran], 20) * 60000;

const WORKER_SNIPPET = [
  '// Cloudflare Worker: keeps your OANDA token off the page. Set OANDA_TOKEN as a secret.',
  'export default {',
  '  async fetch(req, env) {',
  '    const url = new URL(req.url);',
  '    const cors = { "Access-Control-Allow-Origin": "*" }; // tighten to your own origin',
  '    if (req.method === "OPTIONS") return new Response(null, { headers: { ...cors, "Access-Control-Allow-Headers": "*" } });',
  '    if (!url.pathname.startsWith("/v3/instruments/")) return new Response("forbidden", { status: 403 });',
  '    const r = await fetch("https://api-fxpractice.oanda.com" + url.pathname + url.search,',
  '      { headers: { Authorization: "Bearer " + env.OANDA_TOKEN } });',
  '    return new Response(r.body, { status: r.status, headers: { ...cors, "Content-Type": "application/json" } });',
  '  }',
  '}'
].join('\n');

/* =====================================================================
   APP
===================================================================== */
function App() {
  const [settings, setSettings] = useState(() => {
    const s = loadJSON(LS.settings, {});
    return { ...DEFAULTS, ...s, enabled: { ...DEFAULTS.enabled, ...(s.enabled || {}) } };
  });
  const settingsRef = useRef(settings); settingsRef.current = settings;
  useEffect(() => saveJSON(LS.settings, settings), [settings]);
  const upd = (k, v) => setSettings(s => ({ ...s, [k]: v }));

  const cache = useMemo(() => loadJSON(LS.cache, {}), []);
  const [rows, setRows] = useState(cache.rows || {});
  const [drivers, setDrivers] = useState(cache.drivers || {});
  const rowsRef = useRef(rows); rowsRef.current = rows;
  const driversRef = useRef(drivers); driversRef.current = drivers;
  const [journal, setJournal] = useState(() => loadJSON(LS.journal, []));
  const journalRef = useRef(journal); journalRef.current = journal;
  useEffect(() => saveJSON(LS.journal, journal), [journal]);
  const [events, setEvents] = useState(() => loadJSON(LS.events, []));
  const eventsRef = useRef(events); eventsRef.current = events;
  useEffect(() => saveJSON(LS.events, events), [events]);

  const [busy, setBusy] = useState(false);
  const busyRef = useRef(false);
  const [status, setStatus] = useState({ msg: '', error: false });
  const [now, setNow] = useState(Date.now());
  const [sort, setSort] = useState({ key: 'lean', dir: 'desc' });
  const [selected, setSelected] = useState('XAUUSD');
  const [showSettings, setShowSettings] = useState(!loadJSON(LS.settings, null));
  const [evInput, setEvInput] = useState({ when: '', label: '' });

  useEffect(() => { const i = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(i); }, []);

  /* ----- refresh ----- */
  const refresh = useCallback(async () => {
    if (busyRef.current) return;
    const s = settingsRef.current;
    const needsCreds = s.provider === 'oanda' ? !(s.oandaToken.trim() || s.proxyUrl.trim()) : !s.tdKey.trim();
    if (needsCreds) {
      setStatus({ msg: s.provider === 'oanda' ? 'Add your OANDA token (or proxy URL) in Settings first.' : 'Add your Twelve Data API key in Settings first.', error: true });
      setShowSettings(true);
      return;
    }
    busyRef.current = true; setBusy(true);

    const gm = GRAN_MIN[s.gran];
    const count = Math.min(5000, Math.ceil(7 * 1440 / gm));
    const spacing = s.provider === 'oanda' ? 120 : 8000;   // Twelve Data free plan is ~8 requests/minute
    const symOf = (x) => s.provider === 'oanda' ? x.oanda : x.td;

    const queue = [
      ...MARKETS.filter(m => s.enabled[m.id]).map(m => ({ ...m, kind: 'market' })),
      ...(s.drivers ? DRIVERS.filter(d => symOf(d)).map(d => ({ ...d, kind: 'driver' })) : [])
    ];

    const candlesMap = {};
    const errors = [];
    const newRows = {}, newDrivers = {};
    for (let i = 0; i < queue.length; i++) {
      const item = queue[i];
      setStatus({ msg: 'Fetching ' + item.name + ' (' + (i + 1) + '/' + queue.length + ')', error: false });
      let result;
      try {
        const candles = s.provider === 'oanda' ? await fetchOanda(symOf(item), s, count) : await fetchTwelveData(symOf(item), s, count);
        result = analyze(candles, s, item.fallbackSpread || 0, Date.now());
        if (!result.error) candlesMap[item.id] = candles;
      } catch (e) {
        result = { error: String(e.message || e) + (e instanceof TypeError ? ' (network/CORS blocked - see the proxy note in Settings)' : '') };
      }
      if (result.error) errors.push(item.name + ': ' + result.error);
      const setter = item.kind === 'market' ? setRows : setDrivers;
      (item.kind === 'market' ? newRows : newDrivers)[item.id] = result;
      setter(prev => ({ ...prev, [item.id]: result }));
      if (i < queue.length - 1) await sleep(spacing);
    }

    /* ----- journal: resolve open entries, then log fresh actionable setups ----- */
    const nowMs = Date.now();
    const evs = eventsRef.current;
    const blackout = evs.some(e => nowMs >= e.ts - 15 * 60000 && nowMs <= e.ts + 5 * 60000);
    let j = journalRef.current.map(e => (e.status === 'open' && candlesMap[e.market]) ? evalEntry(e, candlesMap[e.market], nowMs, s.expireHours) : e);
    let logged = 0;
    for (const m of MARKETS) {
      const a = newRows[m.id];
      if (!a || a.error) continue;
      const ok = a.actionable && !blackout && (nowMs - a.lastT) <= staleMs(s) && a.spread <= 0.25 * a.atr;
      if (!ok) continue;
      if (j.some(e => e.market === m.id && e.dir === a.dir && nowMs - e.ts < 60 * 60000)) continue;
      const p = tradePlan(a, s, a.dir);
      j.push({ id: m.id + '-' + nowMs, ts: nowMs, market: m.id, dir: a.dir, setup: a.setup, score: a.lean, entry: p.entry, stop: p.stop, t1: p.t1, t2: p.t2, atr: a.atr, stopMult: s.stopMult, spread: a.spread, lastT: a.lastT, status: 'open', r: null });
      logged++;
    }
    j = j.slice(-500);
    journalRef.current = j; setJournal(j);

    // cache fresh (non-error) results only
    const good = (o) => Object.fromEntries(Object.entries(o).filter(([, v]) => v && !v.error));
    saveJSON(LS.cache, { rows: good({ ...rowsRef.current, ...newRows }), drivers: good({ ...driversRef.current, ...newDrivers }) });

    busyRef.current = false; setBusy(false);
    setStatus({
      msg: 'Updated ' + (queue.length - errors.length) + '/' + queue.length + ' at ' + fmtMel(Date.now()) + (logged ? ' - ' + logged + ' new journal entr' + (logged > 1 ? 'ies' : 'y') : ''),
      error: errors.length > 0, detail: errors
    });
  }, []);

  useEffect(() => {
    if (!settings.auto) return;
    const i = setInterval(() => { if (!document.hidden) refresh(); }, Math.max(15, settings.refreshSec) * 1000);
    return () => clearInterval(i);
  }, [settings.auto, settings.refreshSec, refresh]);

  /* ----- derived ----- */
  const sessionList = useMemo(() => Object.keys(SESSIONS).map(k => sessionInfo(k, now)), [Math.floor(now / 30000)]);
  const sessionOpen = Object.fromEntries(sessionList.map(x => [x.key, x.isOpen]));
  const activeEvent = events.find(e => now >= e.ts - 15 * 60000 && now <= e.ts + 5 * 60000);
  const nextEvent = events.filter(e => e.ts > now).sort((a, b) => a.ts - b.ts)[0];

  const tableRows = useMemo(() => {
    const list = MARKETS.filter(m => settings.enabled[m.id]).map(m => {
      const a = rows[m.id];
      const ok = a && !a.error;
      const stale = ok && (now - a.lastT) > staleMs(settings);
      const dataOld = ok && (now - a.fetchedAt) > 180000;
      const wide = ok && a.spread > 0.25 * a.atr;
      const core = m.sessions.some(k => sessionOpen[k]);
      const tradeable = ok && a.actionable && !stale && !dataOld && !wide && !activeEvent;
      return { m, a, ok, stale, dataOld, wide, core, tradeable,
        chgAtr: ok ? (a.price - a.dayOpen) / a.atr : null,
        spreadPct: ok ? a.spread / a.atr : null,
        absLean: ok ? Math.abs(a.lean) : null };
    });
    const key = sort.key;
    const val = (r) => key === 'name' ? r.m.name : key === 'lean' ? (r.ok ? (r.a.actionable ? 1000 : 0) + r.absLean : null)
      : key === 'chgAtr' ? r.chgAtr : key === 'dev' ? (r.ok ? r.a.dev : null) : key === 'spreadPct' ? r.spreadPct
      : key === 'rsi' ? (r.ok ? r.a.rsi : null) : key === 'adx' ? (r.ok ? r.a.adx : null) : key === 'rvol' ? (r.ok ? r.a.rvol : null) : null;
    return list.sort((x, y) => {
      const a = val(x), b = val(y);
      if (a == null && b == null) return 0;
      if (a == null) return 1;
      if (b == null) return -1;
      const c = typeof a === 'string' ? a.localeCompare(b) : a - b;
      return sort.dir === 'asc' ? c : -c;
    });
  }, [rows, settings, sort, now, activeEvent, sessionOpen.tokyo, sessionOpen.hk, sessionOpen.shanghai, sessionOpen.london, sessionOpen.ny]);

  const headerClick = (key) => setSort(s => s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: key === 'name' ? 'asc' : 'desc' });
  const arrow = (key) => sort.key === key ? (sort.dir === 'asc' ? ' \u25B2' : ' \u25BC') : '';
  const th = (key, label, title, align) => html`<th className=${'sortable ' + (align || 'text-right')} tabIndex="0" title=${title || ''} onClick=${() => headerClick(key)} onKeyDown=${(e) => e.key === 'Enter' && headerClick(key)}>${label}${arrow(key)}</th>`;

  const anyData = Object.values(rows).some(r => r && !r.error);
  const oldestFetch = Math.min(...Object.values(rows).filter(r => r && !r.error).map(r => r.fetchedAt), Infinity);
  const showCachedBanner = anyData && !busy && (now - oldestFetch) > 180000;

  const sel = tableRows.find(r => r.m.id === selected) || tableRows[0];
  const stats = useMemo(() => journalStats(journal), [journal]);

  const addEvent = () => {
    if (!evInput.when) return;
    const ts = new Date(evInput.when).getTime();
    if (isNaN(ts)) return;
    setEvents(es => [...es, { id: 'e' + ts + Math.random().toString(36).slice(2, 6), ts, label: evInput.label.trim() || 'Event' }].sort((a, b) => a.ts - b.ts));
    setEvInput({ when: '', label: '' });
  };

  const exportCSV = () => {
    const head = ['time_melbourne', 'market', 'direction', 'setup', 'score', 'entry', 'stop', 'target_2R', 'status', 'R'];
    const lines = journal.map(e => [fmtMelFull(e.ts), e.market, e.dir > 0 ? 'long' : 'short', e.setup, e.score, e.entry, e.stop, e.t2, e.status, e.r == null ? '' : e.r.toFixed(2)].join(','));
    const blob = new Blob([[head.join(','), ...lines].join('\n')], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'scanner-journal.csv'; a.click();
  };

  /* ----- small render helpers ----- */
  const leanBar = (v) => html`
    <div className="flex items-center gap-2 justify-center">
      <div style=${{ width: 80, height: 8, background: 'var(--ink)', border: '1px solid var(--line)', position: 'relative', borderRadius: 2 }}>
        <div style=${{ position: 'absolute', top: 0, bottom: 0, left: v >= 0 ? '50%' : (50 + v / 2) + '%', width: Math.abs(v) / 2 + '%', background: v >= 0 ? 'var(--up)' : 'var(--down)' }}></div>
        <div style=${{ position: 'absolute', top: -2, bottom: -2, left: '50%', width: 1, background: 'var(--muted)' }}></div>
      </div>
      <span className=${'num w-9 text-right ' + (v > 0 ? 'up' : v < 0 ? 'down' : 'muted')}>${fmtSigned(v, 0)}</span>
    </div>`;

  const planCol = (a, dir) => {
    const p = tradePlan(a, settings, dir);
    return html`
      <div className="flex-1 min-w-[220px]">
        <div className=${'font-medium mb-2 ' + (dir > 0 ? 'up' : 'down')}>${dir > 0 ? 'Long' : 'Short'}</div>
        <table className="w-full text-sm num">
          <tbody>
            <tr><td className="muted !py-1">Entry (mid)</td><td className="text-right !py-1">${fmtPx(p.entry)}</td></tr>
            <tr><td className="muted !py-1">Stop (${settings.stopMult}x ATR)</td><td className="text-right !py-1">${fmtPx(p.stop)}</td></tr>
            <tr><td className="muted !py-1">Target 1R</td><td className="text-right !py-1">${fmtPx(p.t1)}</td></tr>
            <tr><td className="muted !py-1">Target 2R</td><td className="text-right !py-1">${fmtPx(p.t2)}</td></tr>
            <tr><td className="muted !py-1">Units for ${p.risk.toFixed(0)} risk</td><td className="text-right !py-1">${p.units}</td></tr>
            <tr><td className="muted !py-1">Spread cost</td><td className="text-right !py-1">$${p.spreadCost.toFixed(2)}</td></tr>
            <tr><td className="muted !py-1">Notional</td><td className="text-right !py-1">$${p.notional.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td></tr>
          </tbody>
        </table>
      </div>`;
  };

  const levelsFor = (a) => {
    const pivot = a.pdh != null ? (a.pdh + a.pdl + a.pdc) / 3 : null;
    const items = [
      { l: 'Price', v: a.price, me: true },
      { l: 'Day high', v: a.dayHigh }, { l: 'Day low', v: a.dayLow }, { l: 'Day open', v: a.dayOpen },
      { l: 'VWAP', v: a.vwap }, { l: 'EMA 20', v: a.ema20 }, { l: 'EMA 50', v: a.ema50 },
      ...(a.pdh != null ? [
        { l: 'Prior day high', v: a.pdh }, { l: 'Prior day low', v: a.pdl }, { l: 'Prior day close', v: a.pdc },
        { l: 'Pivot', v: pivot }, { l: 'R1', v: 2 * pivot - a.pdl }, { l: 'S1', v: 2 * pivot - a.pdh }
      ] : [])
    ];
    return items.sort((x, y) => y.v - x.v);
  };

  /* =====================================================================
     RENDER
  ===================================================================== */
  return html`
  <div className="max-w-[1280px] mx-auto p-4 md:p-6">

    <div className="flex flex-wrap justify-between items-end gap-4 mb-4">
      <div>
        <h1 className="text-2xl font-semibold">Day Trade Scanner</h1>
        <div className="muted text-sm mt-1">Melbourne <span className="num text-[var(--text)]">${fmtMelFull(now)}</span></div>
      </div>
      <div className="flex flex-wrap gap-2">
        ${sessionList.map(x => html`
          <div key=${x.key} className="panel px-3 py-2 text-xs" title=${'Core hours in Melbourne time (lunch breaks not modelled)'}>
            <div className=${'font-medium ' + (x.isOpen ? 'up' : 'muted')}>${x.label} ${x.isOpen ? 'open' : 'closed'}</div>
            <div className="num muted">${fmtMel(x.openT)}\u2013${fmtMel(x.closeT)}</div>
          </div>`)}
      </div>
    </div>

    ${activeEvent && html`<div className="panel px-4 py-3 mb-3 warn" style=${{ borderColor: 'var(--warn)' }}>
      No-trade window: <b>${activeEvent.label}</b> at ${fmtMel(activeEvent.ts)}. Setups are suppressed from 15 min before to 5 min after.</div>`}
    ${!activeEvent && nextEvent && html`<div className="panel px-4 py-2 mb-3 text-sm muted">
      Next event: <span className="text-[var(--text)]">${nextEvent.label}</span> at ${fmtMel(nextEvent.ts)} (in ${fmtAge(nextEvent.ts - now)})</div>`}
    ${showCachedBanner && html`<div className="panel px-4 py-2 mb-3 text-sm warn" style=${{ borderColor: 'var(--warn)' }}>
      Showing data from ${fmtAge(now - oldestFetch)} ago. Nothing is live until you refresh.</div>`}

    <div className="flex flex-wrap items-center gap-3 mb-4">
      <button className="btn btn-primary" disabled=${busy} onClick=${refresh}>${busy ? 'Updating...' : 'Update data'}</button>
      <label className="flex items-center gap-2 text-sm muted">
        <input type="checkbox" checked=${settings.auto} onChange=${(e) => upd('auto', e.target.checked)} />
        Auto-refresh every
        <input type="number" min="15" className="w-16 num" value=${settings.refreshSec} onChange=${(e) => upd('refreshSec', Math.max(15, +e.target.value || 30))} /> s
      </label>
      <button className="btn" onClick=${() => setShowSettings(v => !v)}>${showSettings ? 'Hide settings' : 'Settings'}</button>
      <span className=${'text-sm ' + (status.error ? 'down' : 'muted')}>${status.msg}</span>
    </div>
    ${status.detail && status.detail.length > 0 && html`<div className="panel px-4 py-2 mb-4 text-xs down">${status.detail.map((d, i) => html`<div key=${i}>${d}</div>`)}</div>`}

    ${showSettings && html`
    <div className="panel p-4 mb-4">
      <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-3 text-sm">
        <label className="flex flex-col gap-1"><span className="muted">Data source</span>
          <select value=${settings.provider} onChange=${(e) => upd('provider', e.target.value)}>
            <option value="oanda">OANDA v20 (real CFD prices, bid/ask)</option>
            <option value="twelvedata">Twelve Data (slower on free plan, no bid/ask)</option>
          </select></label>

        ${settings.provider === 'oanda' ? html`
          <label className="flex flex-col gap-1"><span className="muted">OANDA API token</span>
            <input type="password" autoComplete="off" value=${settings.oandaToken} onChange=${(e) => upd('oandaToken', e.target.value)} placeholder="Stored only in this browser" /></label>
          <label className="flex flex-col gap-1"><span className="muted">Environment</span>
            <select value=${settings.oandaEnv} onChange=${(e) => upd('oandaEnv', e.target.value)}>
              <option value="practice">Practice</option><option value="live">Live</option></select></label>
          <label className="flex flex-col gap-1 md:col-span-2"><span className="muted">Proxy URL (optional, replaces token above)</span>
            <input value=${settings.proxyUrl} onChange=${(e) => upd('proxyUrl', e.target.value)} placeholder="https://your-worker.workers.dev" /></label>
        ` : html`
          <label className="flex flex-col gap-1"><span className="muted">Twelve Data API key</span>
            <input type="password" autoComplete="off" value=${settings.tdKey} onChange=${(e) => upd('tdKey', e.target.value)} placeholder="Stored only in this browser" /></label>
        `}

        <label className="flex flex-col gap-1"><span className="muted">Candle size</span>
          <select value=${settings.gran} onChange=${(e) => upd('gran', e.target.value)}>
            <option value="M1">1 minute</option><option value="M5">5 minute</option><option value="M15">15 minute</option></select></label>
        <label className="flex flex-col gap-1"><span className="muted">Trading day starts (UTC hour)</span>
          <input type="number" min="0" max="23" className="num" value=${settings.rolloverUtc} onChange=${(e) => upd('rolloverUtc', clamp(+e.target.value || 0, 0, 23))} /></label>
        <label className="flex flex-col gap-1"><span className="muted">Account equity ($)</span>
          <input type="number" className="num" value=${settings.equity} onChange=${(e) => upd('equity', +e.target.value || 0)} /></label>
        <label className="flex flex-col gap-1"><span className="muted">Risk per trade (%)</span>
          <input type="number" step="0.1" className="num" value=${settings.riskPct} onChange=${(e) => upd('riskPct', +e.target.value || 0)} /></label>
        <label className="flex flex-col gap-1"><span className="muted">Stop distance (x ATR)</span>
          <input type="number" step="0.25" className="num" value=${settings.stopMult} onChange=${(e) => upd('stopMult', Math.max(0.25, +e.target.value || 1))} /></label>
        <label className="flex flex-col gap-1"><span className="muted">Minimum lean to flag a setup (0-100)</span>
          <input type="number" className="num" value=${settings.minScore} onChange=${(e) => upd('minScore', clamp(+e.target.value || 0, 0, 100))} /></label>
        <label className="flex flex-col gap-1"><span className="muted">Journal entry expires after (hours)</span>
          <input type="number" min="1" className="num" value=${settings.expireHours} onChange=${(e) => upd('expireHours', Math.max(1, +e.target.value || 4))} /></label>
        <label className="flex items-center gap-2"><input type="checkbox" checked=${settings.drivers} onChange=${(e) => upd('drivers', e.target.checked)} /> Fetch cross-market drivers</label>
      </div>

      <div className="mt-4 text-sm">
        <div className="muted mb-1">Markets to scan (fewer markets = faster refresh)</div>
        <div className="flex flex-wrap gap-4">
          ${MARKETS.map(m => html`<label key=${m.id} className="flex items-center gap-2">
            <input type="checkbox" checked=${!!settings.enabled[m.id]} onChange=${(e) => setSettings(s => ({ ...s, enabled: { ...s.enabled, [m.id]: e.target.checked } }))} /> ${m.name}</label>`)}
        </div>
      </div>

      <div className="mt-4 text-sm">
        <div className="muted mb-1">No-trade events (your browser's local time)</div>
        <div className="flex flex-wrap gap-2 items-center">
          <input type="datetime-local" value=${evInput.when} onChange=${(e) => setEvInput(v => ({ ...v, when: e.target.value }))} />
          <input placeholder="e.g. US CPI, FOMC, EIA oil inventories" className="w-72" value=${evInput.label} onChange=${(e) => setEvInput(v => ({ ...v, label: e.target.value }))} />
          <button className="btn" onClick=${addEvent}>Add event</button>
        </div>
        <div className="mt-2 flex flex-wrap gap-2">
          ${events.filter(e => e.ts > now - 3600000).map(e => html`<span key=${e.id} className="tag">${fmtMelFull(e.ts)} ${e.label}
            <button className="ml-1 muted" aria-label="Remove event" onClick=${() => setEvents(es => es.filter(x => x.id !== e.id))}>\u00D7</button></span>`)}
        </div>
      </div>

      <details className="mt-4">
        <summary>Keeping your token off the page (recommended for live accounts)</summary>
        <p className="muted text-sm my-2">A token typed into this page sits in your browser's local storage. A small proxy keeps it server-side and also solves any browser CORS block. Deploy this as a Cloudflare Worker, add OANDA_TOKEN as a secret, then paste the Worker URL into the Proxy field above. It only forwards read-only candle requests.</p>
        <pre>${WORKER_SNIPPET}</pre>
      </details>
    </div>`}

    <div className="panel overflow-x-auto mb-4">
      <table className="w-full text-sm">
        <thead>
          <tr>
            ${th('name', 'Market', '', 'text-left')}
            <th className="text-left">Hours</th>
            <th className="text-right">Price</th>
            ${th('chgAtr', 'Day move', 'Move since the trading-day open, in ATRs')}
            ${th('dev', 'vs VWAP', 'Distance from session VWAP, in ATRs')}
            ${th('rsi', 'RSI', 'Wilder RSI(14) on the candles')}
            ${th('adx', 'ADX', 'Trend strength. Below 20 = range, above 22 = trend')}
            ${th('rvol', 'Rel. vol', 'Tick volume so far today vs same time on prior days')}
            ${th('lean', 'Lean', 'Sort: actionable setups first, then by strength', 'text-center')}
            <th className="text-left">Setup</th>
            ${th('spreadPct', 'Spread', 'Spread as a share of 1 ATR. Above 25% the setup is blocked')}
            <th className="text-left">Flags</th>
          </tr>
        </thead>
        <tbody>
          ${tableRows.map(r => {
            const { m, a } = r;
            const isSel = sel && sel.m.id === m.id;
            if (!a) return html`<tr key=${m.id} className="row" onClick=${() => setSelected(m.id)}><td className="font-medium">${m.name}</td><td colSpan="11" className="muted">No data yet. Press Update data.</td></tr>`;
            if (a.error) return html`<tr key=${m.id} className="row" onClick=${() => setSelected(m.id)}><td className="font-medium">${m.name}</td><td colSpan="11" className="down">${a.error}</td></tr>`;
            const faded = (r.stale || r.dataOld) ? { opacity: 0.55 } : null;
            return html`
            <tr key=${m.id} className=${'row ' + (isSel ? 'sel' : '')} style=${faded} onClick=${() => setSelected(m.id)}>
              <td className="font-medium">${m.name}</td>
              <td><span className=${'tag ' + (r.core ? 'up' : 'muted')}>${r.core ? 'core' : 'off-hours'}</span></td>
              <td className="num text-right">${fmtPx(a.price)}</td>
              <td className=${'num text-right ' + (r.chgAtr > 0 ? 'up' : 'down')}>${fmtSigned(r.chgAtr, 2)} ATR</td>
              <td className=${'num text-right ' + (a.dev > 0 ? 'up' : 'down')}>${fmtSigned(a.dev, 2)}</td>
              <td className=${'num text-right ' + (a.rsi >= 70 || a.rsi <= 30 ? 'warn' : '')}>${a.rsi.toFixed(0)}</td>
              <td className="num text-right" title=${a.regime}>${a.adx.toFixed(0)} <span className="muted text-xs">${a.regime}</span></td>
              <td className="num text-right">${a.rvol == null ? html`<span className="muted" title="Needs 2+ prior days with volume">-</span>` : a.rvol.toFixed(2) + 'x'}</td>
              <td>${leanBar(a.lean)}</td>
              <td>${a.entryType
                ? html`<span className=${'tag ' + (a.dir > 0 ? 'up' : 'down')} style=${{ borderColor: r.tradeable ? (a.dir > 0 ? 'var(--up)' : 'var(--down)') : 'var(--line)' }}>${a.setup}${a.actionable ? '' : ' (weak)'}</span>`
                : html`<span className="muted text-xs">${a.setup}</span>`}</td>
              <td className=${'num text-right ' + (r.wide ? 'down' : '')} title=${a.spreadReal ? 'Live bid/ask spread' : 'Assumed spread (feed has no bid/ask)'}>${(r.spreadPct * 100).toFixed(0)}%${a.spreadReal ? '' : '*'}</td>
              <td>
                ${r.tradeable && html`<span className="tag up">ready</span>`}
                ${r.stale && html`<span className="tag warn" title=${'Last candle ' + fmtAge(now - a.lastT) + ' ago. Market closed or feed stalled.'}>stale ${fmtAge(now - a.lastT)}</span>`}
                ${r.dataOld && html`<span className="tag warn" title="Not refreshed recently">old data</span>`}
                ${r.wide && html`<span className="tag down">wide spread</span>`}
                ${activeEvent && html`<span className="tag warn">event</span>`}
              </td>
            </tr>`;
          })}
        </tbody>
      </table>
    </div>

    ${sel && sel.ok && html`
    <div className="panel p-4 mb-4">
      <div className="flex flex-wrap justify-between gap-2 mb-3">
        <h2 className="text-lg font-semibold">${sel.m.name}: levels and risk</h2>
        <div className="muted text-sm">ATR(14) <span className="num text-[var(--text)]">${fmtPx(sel.a.atr)}</span> \u00B7 spread <span className="num text-[var(--text)]">${fmtPx(sel.a.spread)}</span> \u00B7 data ${fmtAge(now - sel.a.fetchedAt)} old</div>
      </div>
      <div className="flex flex-wrap gap-6">
        <div className="flex-1 min-w-[260px]">
          <div className="muted text-sm mb-1">Level ladder</div>
          <table className="w-full text-sm num">
            <tbody>
              ${levelsFor(sel.a).map(x => html`<tr key=${x.l} style=${x.me ? { background: 'rgba(106,167,232,.12)' } : null}>
                <td className=${'!py-1 ' + (x.me ? 'font-medium' : 'muted')} style=${{ fontFamily: "'IBM Plex Sans', sans-serif" }}>${x.l}</td>
                <td className="text-right !py-1">${fmtPx(x.v)}</td>
                <td className=${'text-right !py-1 ' + (x.me ? '' : (x.v > sel.a.price ? 'down' : 'up'))}>${x.me ? '' : fmtSigned((x.v - sel.a.price) / sel.a.atr, 2) + ' ATR'}</td>
              </tr>`)}
            </tbody>
          </table>
        </div>
        <div className="flex-[2] min-w-[300px]">
          <div className="muted text-sm mb-1">Trade plan at current price (risk ${settings.riskPct}% of $${settings.equity.toLocaleString()})</div>
          <div className="flex flex-wrap gap-6">${planCol(sel.a, 1)}${planCol(sel.a, -1)}</div>
          <div className="muted text-xs mt-3">Lean breakdown: trend ${fmtSigned(sel.a.parts.trend, 0)}, VWAP ${fmtSigned(sel.a.parts.vwap, 0)}, day move ${fmtSigned(sel.a.parts.momentum, 0)}, RSI ${fmtSigned(sel.a.parts.rsi, 0)}${sel.a.regime === 'Range' ? ' (range regime: VWAP, move and RSI are inverted to fade stretches)' : ''}.
            Units assume a USD account and $1 per point per unit. Round down to your broker's step size and check minimum size and margin.</div>
        </div>
      </div>
    </div>`}

    ${settings.drivers && html`
    <div className="grid gap-3 md:grid-cols-3 mb-4">
      ${DRIVERS.map(d => {
        const a = drivers[d.id];
        const unavailable = settings.provider === 'twelvedata' && !d.td;
        return html`<div key=${d.id} className="panel p-3 text-sm">
          <div className="flex justify-between"><span className="font-medium">${d.name}</span>
            ${a && !a.error && html`<span className=${'num ' + (a.price >= a.dayOpen ? 'up' : 'down')}>${fmtSigned((a.price / a.dayOpen - 1) * 100, 2)}% today</span>`}</div>
          <div className="num mt-1">${unavailable ? html`<span className="muted">Not on this data source</span>` : !a ? html`<span className="muted">-</span>` : a.error ? html`<span className="down text-xs">${a.error}</span>` : fmtPx(a.price)}</div>
          <div className="muted text-xs mt-1">${d.note}</div>
        </div>`;
      })}
    </div>`}

    <div className="panel p-4 mb-4">
      <div className="flex flex-wrap justify-between items-center gap-2 mb-3">
        <h2 className="text-lg font-semibold">Signal journal</h2>
        <div className="flex gap-2">
          <button className="btn" onClick=${exportCSV} disabled=${!journal.length}>Export CSV</button>
          <button className="btn" onClick=${() => { if (confirm('Delete the whole journal?')) setJournal([]); }} disabled=${!journal.length}>Clear</button>
        </div>
      </div>
      <p className="muted text-sm mb-3">Every actionable setup is logged when you refresh (max one per market and direction per hour) and resolved automatically against later candles: -1R at the stop, +2R at the target, otherwise closed at market after ${settings.expireHours}h. If a candle touches both, the stop is assumed first. This is how you find out whether a higher score has ever meant anything. It only records while this page is open and refreshing.</p>
      <div className="flex flex-wrap gap-6 text-sm mb-3">
        <div><div className="muted">Closed</div><div className="num text-lg">${stats.all.n}</div></div>
        <div><div className="muted">Open</div><div className="num text-lg">${stats.open}</div></div>
        <div><div className="muted">Win rate</div><div className="num text-lg">${stats.all.win == null ? '-' : (stats.all.win * 100).toFixed(0) + '%'}</div></div>
        <div><div className="muted">Average R</div><div className=${'num text-lg ' + (stats.all.avgR > 0 ? 'up' : stats.all.avgR < 0 ? 'down' : '')}>${stats.all.avgR == null ? '-' : fmtSigned(stats.all.avgR, 2)}</div></div>
        ${stats.buckets.map(b => html`<div key=${b.label}><div className="muted">Score ${b.label}</div>
          <div className="num">${b.n ? (b.win * 100).toFixed(0) + '% win, ' + fmtSigned(b.avgR, 2) + 'R (n=' + b.n + ')' : 'n=0'}</div></div>`)}
      </div>
      ${journal.length > 0 && html`
      <div className="overflow-x-auto"><table className="w-full text-sm">
        <thead><tr><th className="text-left">Time (Melbourne)</th><th className="text-left">Market</th><th className="text-left">Setup</th><th className="text-right">Score</th><th className="text-right">Entry</th><th className="text-right">Stop</th><th className="text-right">2R target</th><th className="text-right">Result</th></tr></thead>
        <tbody>
          ${[...journal].reverse().slice(0, 20).map(e => html`<tr key=${e.id} className="row" style=${{ cursor: 'default' }}>
            <td className="num">${fmtMelFull(e.ts)}</td>
            <td>${(MARKETS.find(m => m.id === e.market) || {}).name || e.market}</td>
            <td><span className=${'tag ' + (e.dir > 0 ? 'up' : 'down')}>${e.setup}</span></td>
            <td className="num text-right">${fmtSigned(e.score, 0)}</td>
            <td className="num text-right">${fmtPx(e.entry)}</td>
            <td className="num text-right">${fmtPx(e.stop)}</td>
            <td className="num text-right">${fmtPx(e.t2)}</td>
            <td className=${'num text-right ' + (e.status === 'open' ? 'muted' : e.r > 0 ? 'up' : 'down')}>${e.status === 'open' ? 'open' : fmtSigned(e.r, 2) + 'R (' + e.status + ')'}</td>
          </tr>`)}
        </tbody></table></div>`}
    </div>

    <div className="panel p-4 text-sm muted leading-relaxed">
      <div className="text-[var(--text)] font-medium mb-1">How the lean works</div>
      Lean runs from -100 (short) to +100 (long) and is built from four parts: EMA20/EMA50 trend weighted by ADX, distance from VWAP, move since the day open, and RSI, all measured in ATRs so one set of thresholds fits gold and the Nasdaq alike.
      When ADX is below 20 the market is treated as a range and the last three parts flip to fade stretches instead of following them. Setups (breakout of the prior day's range, pullback in a trend, range fade, exhaustion at an extreme) are separate rules, and an exhaustion fade is never flagged while ADX is above 35; a setup is only flagged when its direction agrees with the lean and the lean clears your minimum.
      Setups are blocked when the data is stale, the spread exceeds 25% of an ATR, or you are inside an event window.
      <div className="mt-2">Volume is tick count for CFDs, so relative volume is a rough guide. The day boundary is a fixed UTC hour, so adjust it twice a year for daylight saving. None of these thresholds have been validated; the journal above is there to test them with your own data. This tool is a screening aid, not advice, and leveraged CFDs can lose more than your stake quickly.</div>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
