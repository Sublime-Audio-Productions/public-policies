   LONG-TERM BUYS TAB  (daily candles from eToro through your Worker, analysed in this page)
===================================================================== */
const LT_KEYS = { cfg: 'dts2_lt', cache: 'dts2_lt_cache', sec: 'dts2_sec_cache', funds: 'dts2_sec_funds' };
const secTicker = (sym) => { let t = String(sym || '').toUpperCase().replace(/\.24-7$/, ''); if (/^[A-Z]{1,5}\.[A-Z]$/.test(t)) t = t.replace('.', '-'); return /^[A-Z]{1,5}(-[A-Z])?$/.test(t) ? t : null; };
const LT_ORDER = { 'Buy now': 0, 'Accumulate on dips': 1, 'Wait': 2, 'Avoid for now': 3, 'Not enough history': 4 };
const ltRatingCls = (r) => r === 'Buy now' || r === 'Accumulate on dips' ? 'up' : r === 'Wait' ? 'warn' : r === 'Avoid for now' ? 'down' : 'muted';

function LongTermTab({ settings }) {
  const [cfg, setCfg] = useState(() => ({ symbols: LT_DEFAULT_SYMBOLS.join('\n'), horizon: 12, ...loadJSON(LT_KEYS.cfg, {}) }));
  useEffect(() => saveJSON(LT_KEYS.cfg, cfg), [cfg]);
  const cfgRef = useRef(cfg); cfgRef.current = cfg;
  const [entries, setEntries] = useState(() => loadJSON(LT_KEYS.cache, {}).entries || {});
  useEffect(() => saveJSON(LT_KEYS.cache, { entries }), [entries]);
  const raw = useRef({});                                   // downloaded candles stay in memory, so changing the horizon needs no new download
  const busyRef = useRef(false);
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState('');
  const [filter, setFilter] = useState('all');
  const [selected, setSelected] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [showHow, setShowHow] = useState(false);
  const upd = (k, v) => setCfg(c => ({ ...c, [k]: v }));
  const [sec, setSec] = useState(() => loadJSON(LT_KEYS.sec, {}));
  useEffect(() => saveJSON(LT_KEYS.sec, sec), [sec]);
  const [funds, setFunds] = useState(() => loadJSON(LT_KEYS.funds, null));
  useEffect(() => saveJSON(LT_KEYS.funds, funds), [funds]);
  const [secBusy, setSecBusy] = useState('');

  const workerCall = async (path) => {
    const t = loadJSON(TR_KEYS.cfg, {});
    const base = normalizeBase(t.workerUrl);
    if (!base || !String(t.workerKey || '').trim()) throw new Error('Set your Worker address and access key first: open the Stock tracker tab, then Settings.');
    let r;
    try { r = await fetch(base + path, { headers: { 'x-access-key': String(t.workerKey).trim() } }); }
    catch (e) { throw new Error('Could not reach the Worker. Check its address, and that DASHBOARD_ORIGIN lists this website.'); }
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) throw new Error('The Worker rejected the access key');
    if (!r.ok) { const err = new Error(j.error || ('HTTP ' + r.status)); err.setup = !!j.needsSetup; throw err; }
    return j;
  };
  const loadSec = async (symbol, force) => {
    setSec(p => ({ ...p, [symbol]: { ...(p[symbol] || {}), loading: true, error: null } }));
    try { const j = await workerCall('/api/sec/ownership?symbol=' + encodeURIComponent(symbol) + '&days=90' + (force ? '&refresh=1' : '')); setSec(p => ({ ...p, [symbol]: { data: j, at: Date.now() } })); }
    catch (e) { setSec(p => ({ ...p, [symbol]: { ...(p[symbol] || {}), loading: false, error: e.message, setup: !!e.setup } })); }
  };
  const loadFunds = async (force) => {
    try { const j = await workerCall('/api/sec/funds?symbols=' + encodeURIComponent(parseSymbols(cfgRef.current.symbols).join(',')) + (force ? '&refresh=1' : '')); setFunds({ data: j, at: Date.now() }); }
    catch (e) { setFunds(f => ({ ...(f || {}), error: e.message })); }
  };
  const loadAllSec = async () => {
    if (secBusy) return;
    const list = parseSymbols(cfgRef.current.symbols).filter(sy => !(entries[sy] && entries[sy].error) && secTicker(sy));
    for (let i = 0; i < list.length; i++) { setSecBusy('SEC filings ' + (i + 1) + '/' + list.length + ' (' + list[i] + ')'); await loadSec(list[i], false); }
    setSecBusy('Fund watch'); await loadFunds(false); setSecBusy('');
  };

  const analyse = (sym, candles, meta, horizon) => {
    const r = ltAnalyse(candles, { symbol: sym, horizonMonths: horizon, nowMs: Date.now() });
    return r.error ? { symbol: sym, name: meta.name, type: meta.type, error: r.error } : { ...r, name: meta.name || sym, type: meta.type || '' };
  };

  const refresh = useCallback(async () => {
    if (busyRef.current) return;
    const t = loadJSON(TR_KEYS.cfg, {});                    // the Worker address and key are the ones saved in the Stock tracker tab
    const base = normalizeBase(t.workerUrl);
    if (!base || !String(t.workerKey || '').trim()) { setProgress('Set your Worker address and access key first: open the Stock tracker tab, then Settings.'); return; }
    const symbols = parseSymbols(cfgRef.current.symbols);
    if (!symbols.length) { setProgress('Add some tickers in Settings first.'); setShowSettings(true); return; }
    busyRef.current = true; setBusy(true);
    let done = 0, failed = 0;
    const horizon = cfgRef.current.horizon;
    await trPool(symbols, 3, async (sym) => {
      let entry;
      try {
        const r = await fetch(base + '/api/etoro/candles?symbol=' + encodeURIComponent(sym) + '&count=1000&interval=OneDay', { headers: { 'x-access-key': String(t.workerKey).trim() } });
        const j = await r.json().catch(() => ({}));
        if (r.status === 401) entry = { symbol: sym, error: 'The Worker rejected the access key' };
        else if (!r.ok) entry = { symbol: sym, error: j.error || ('HTTP ' + r.status), similar: j.similar };
        else {
          const candles = (j.candles || []).map(c => ({ t: c[0], o: c[1], h: c[2], l: c[3], c: c[4], v: c[5] || 0 }));
          raw.current[sym] = { candles, meta: { name: j.name, type: j.type } };
          entry = analyse(sym, candles, { name: j.name, type: j.type }, horizon);
        }
      } catch (e) { entry = { symbol: sym, error: 'Could not reach the Worker. Check its address, and that DASHBOARD_ORIGIN lists this website.' }; }
      done++; if (entry.error) failed++;
      setProgress('Fetched ' + done + '/' + symbols.length + ' (' + sym + ')');
      setEntries(prev => ({ ...prev, [sym]: entry }));
    });
    busyRef.current = false; setBusy(false);
    setProgress('Analysed ' + (symbols.length - failed) + '/' + symbols.length + ' at ' + fmtMel(Date.now()));
  }, []);

  const changeHorizon = (h) => {
    upd('horizon', h);
    const next = {}; let all = true;
    for (const sym of parseSymbols(cfgRef.current.symbols)) {
      const r = raw.current[sym];
      if (r) next[sym] = analyse(sym, r.candles, r.meta, h);
      else if (!(entries[sym] && entries[sym].error)) all = false;       // never downloaded yet; an unknown symbol or one with errors cannot be recalculated and should not block the rest
    }
    setEntries(prev => ({ ...prev, ...next }));
    setProgress(all ? 'Recalculated for ' + h + ' months.' : 'Press Update to analyse for ' + h + ' months.');
  };

  const syms = useMemo(() => parseSymbols(cfg.symbols), [cfg.symbols]);
  const rows = useMemo(() => syms.map(sym => entries[sym] || { symbol: sym, pending: true }), [syms, entries]);
  const ok = rows.filter(r => r.rating);
  const shown = useMemo(() => {
    const keep = rows.filter(r => filter === 'all' || (r.rating && ((filter === 'buy' && r.rating === 'Buy now') || (filter === 'acc' && r.rating === 'Accumulate on dips') || (filter === 'wait' && r.rating === 'Wait') || (filter === 'avoid' && r.rating === 'Avoid for now'))));
    return keep.sort((x, y) => {
      if (!x.rating && !y.rating) return 0; if (!x.rating) return 1; if (!y.rating) return -1;
      const d = LT_ORDER[x.rating] - LT_ORDER[y.rating];
      return d !== 0 ? d : Math.abs(x.buy ? x.buy.distance : 9) - Math.abs(y.buy ? y.buy.distance : 9);
    });
  }, [rows, filter]);
  const sel = ok.find(r => r.symbol === selected) || null;
  const buyNow = ok.filter(r => r.rating === 'Buy now');
  const closest = ok.filter(r => r.rating === 'Accumulate on dips').sort((a, b) => a.buy.distance - b.buy.distance).slice(0, 4);
  const errCount = rows.filter(r => r.error).length;
  const lastFetch = Math.max(0, ...ok.map(r => r.fetchedAt));
  const mismatch = ok.some(r => r.horizonMonths !== cfg.horizon);
  const filterBtn = (k, label) => html`<button key=${k} className=${'btn ' + (filter === k ? 'btn-primary' : '')} onClick=${() => setFilter(k)}>${label}</button>`;
  const pctTxt = (x) => ltPctText(x, 0);
  const upsideOf = (r) => r.projection.trend.highTypical / r.price - 1;
  const downsideOf = (r) => r.projection.trend.lowTypical / r.price - 1;
  const removeSymbol = (sym) => setCfg(c => ({ ...c, symbols: parseSymbols(c.symbols).filter(x => x !== sym).join('\n') }));

  const scen = (label, p) => html`<tr><td className="muted !py-1">${label}</td><td className="num text-right !py-1">${fmtPx(p.lowBad)}</td><td className="num text-right !py-1">${fmtPx(p.lowTypical)}</td><td className="num text-right !py-1">${fmtPx(p.highTypical)}</td><td className="num text-right !py-1">${fmtPx(p.highGood)}</td><td className="num text-right !py-1">${fmtPx(p.final.p10)} / ${fmtPx(p.final.p50)} / ${fmtPx(p.final.p90)}</td></tr>`;

  return html`
  <div>
    <div className="flex flex-wrap items-center gap-3 mb-4">
      <button className="btn btn-primary" disabled=${busy} onClick=${refresh}>${busy ? 'Analysing...' : 'Update analysis'}</button>
      <label className="flex items-center gap-2 text-sm muted">Look ahead
        <select value=${cfg.horizon} onChange=${(e) => changeHorizon(+e.target.value)}>${LT_HORIZONS.map(h => html`<option key=${h} value=${h}>${h} months</option>`)}</select></label>
      <button className="btn" disabled=${!!secBusy} onClick=${loadAllSec} title="Insider trades (Form 4), 5% holders (13D/13G) and your fund watch (13F), from the SEC">${secBusy || 'Load SEC filings for all'}</button>
      <button className="btn" onClick=${() => setShowSettings(v => !v)}>${showSettings ? 'Hide tickers' : 'Edit tickers'}</button>
      <button className="btn" onClick=${() => setShowHow(v => !v)}>${showHow ? 'Hide method' : 'How it works'}</button>
      <span className="text-sm muted">${progress}${lastFetch && !busy ? ' \u00B7 data ' + fmtAge(Date.now() - lastFetch) + ' old' : ''}</span>
    </div>

    ${mismatch && html`<div className="text-xs warn mb-3">Some rows were analysed for a different look-ahead. Press Update analysis to refresh them for ${cfg.horizon} months.</div>`}

    ${showSettings && html`<div className="panel p-4 mb-4"><label className="flex flex-col gap-1 text-sm"><span className="muted">Tickers (one per line, exact eToro symbols). Stocks suit this tab best. Use the Stock tracker tab's Settings to search for exact symbols.</span>
      <textarea rows="8" value=${cfg.symbols} onChange=${(e) => upd('symbols', e.target.value)}></textarea></label>
      <div className="muted text-xs mt-2">It uses the Worker address and access key saved in the Stock tracker tab.</div></div>`}

    ${showHow && html`<div className="panel p-4 mb-4 text-sm leading-relaxed">
      <div className="font-medium mb-1">How these numbers are made</div>
      <p className="muted mb-2">Nothing here predicts the future. The tab downloads about four years of daily candles from eToro and measures how the stock has actually behaved.</p>
      <ul className="muted space-y-1" style=${{ listStyle: 'disc', paddingLeft: 18 }}>
        <li><b className="text-[var(--text)]">Trend score</b> (-100 to +100): price against its 200-day average, 50 against 200 day, whether the 200-day average is rising, the 6 and 12 month returns, weekly RSI and the distance from the 52-week high.</li>
        <li><b className="text-[var(--text)]">Predicted low and high:</b> 4,000 simulated price paths over your look-ahead, using the stock's own volatility and half of its past-year trend (capped at 30% a year). "Predicted low" is the lowest price a typical path touches, and "predicted high" is the highest. The detail panel also shows the 1-in-10 extremes. They are ranges, not forecasts: reality can land outside them.</li>
        <li><b className="text-[var(--text)]">Buy price:</b> the highest sturdy support below the current price that is not far below the typical low. Supports come from weekly turning points that price has bounced off before, the 200-day and 50-week averages, the 52-week low and the 50% and 61.8% pullback levels of the last big rise. The second buy price is the next support down, and the invalidation price sits one weekly range below it.</li>
        <li><b className="text-[var(--text)]">Rating:</b> Not enough history (under about a year), Avoid for now (price below a falling 200-day average), Wait (mixed trend, or poor reward for the risk), Buy now (healthy trend and price at or near the buy price) or Accumulate on dips (healthy trend, price above the buy zone).</li>
      </ul>
      <p className="muted mt-2">Not advice. It does not know your goals, tax or the company's finances, and a stock that looks cheap on a chart can keep falling. Corporate actions such as splits can distort old candles.</p></div>`}

    ${(buyNow.length > 0 || closest.length > 0) && html`
    <div className="grid gap-3 md:grid-cols-2 mb-4">
      <div className="panel p-3 text-sm"><div className="font-medium mb-1">Buy now</div>
        ${buyNow.length === 0 ? html`<div className="muted">Nothing is in its buy zone with a healthy trend right now.</div>` : buyNow.map(r => html`<div key=${r.symbol} className="flex items-center justify-between py-1" style=${{ cursor: 'pointer' }} onClick=${() => setSelected(r.symbol)}><span><b>${r.symbol}</b> <span className="muted text-xs">${r.trend.label}</span></span><span className="num">buy ${fmtPx(r.buy.b1.price)}</span></div>`)}</div>
      <div className="panel p-3 text-sm"><div className="font-medium mb-1">Closest to their buy price</div>
        ${closest.length === 0 ? html`<div className="muted">No healthy-trend stocks are waiting above a buy zone.</div>` : closest.map(r => html`<div key=${r.symbol} className="flex items-center justify-between py-1" style=${{ cursor: 'pointer' }} onClick=${() => setSelected(r.symbol)}><span><b>${r.symbol}</b> <span className="muted text-xs">buy ${fmtPx(r.buy.b1.price)}</span></span><span className="num warn">${pctTxt(-r.buy.distance)} away</span></div>`)}</div>
    </div>`}

    <div className="flex flex-wrap gap-2 mb-3 items-center">
      ${filterBtn('all', 'All (' + rows.length + ')')}${filterBtn('buy', 'Buy now')}${filterBtn('acc', 'Accumulate on dips')}${filterBtn('wait', 'Wait')}${filterBtn('avoid', 'Avoid for now')}
      ${errCount > 0 && html`<span className="down text-sm ml-2">${errCount} ticker${errCount > 1 ? 's' : ''} with errors or too little history</span>`}
    </div>

    <div className="panel overflow-x-auto mb-4">
      <table className="w-full text-sm">
        <thead><tr>
          <th className="text-left">Ticker</th><th className="text-left">Rating</th><th className="text-right">Price</th><th className="text-left">Trend</th>
          <th className="text-right" title="The suggested first buy price, with the deeper second price under it">Buy price</th>
          <th className="text-right" title="How far the price would have to fall to reach the first buy price">To buy</th>
          <th className="text-right" title="The lowest price a typical simulated path touches over your look-ahead. A range, not a forecast">Predicted low</th>
          <th className="text-right" title="The highest price a typical simulated path touches over your look-ahead. A range, not a forecast">Predicted high</th>
          <th className="text-right" title="Typical high against the first buy price, compared with the risk down to the invalidation price">Reward : risk</th>
          <th className="text-right" title="Distance below the 52-week high">From 52w high</th><th className="text-right" title="Annual volatility from the last year and quarter">Volatility</th>
        </tr></thead>
        <tbody>
          ${shown.map(r => {
            if (r.pending) return html`<tr key=${r.symbol} className="row" style=${{ cursor: 'default' }}><td className="font-medium">${r.symbol}</td><td colSpan="10" className="muted">No analysis yet. Press Update analysis.</td></tr>`;
            if (r.error) return html`<tr key=${r.symbol} className="row" style=${{ cursor: 'default' }}><td className="font-medium">${r.symbol}</td><td colSpan="10" className=${/Only \d+ daily candles/.test(r.error) ? 'warn' : 'down'}>${r.error}${r.similar && r.similar.length ? html`<span className="muted"> Similar on eToro: ${r.similar.map(x => x.symbol + (x.name ? ' (' + trShort(x.name) + ')' : '')).join(', ')}.</span>` : ''} <button className="btn ml-2" onClick=${() => removeSymbol(r.symbol)}>Remove</button></td></tr>`;
            return html`<tr key=${r.symbol} className=${'row ' + (selected === r.symbol ? 'sel' : '')} onClick=${() => setSelected(r.symbol)}>
              <td><div className="font-medium">${r.symbol}</div><div className="muted text-xs">${trShort(r.name)}</div>${(() => { const tg = secTag(sec[r.symbol] && sec[r.symbol].data); return tg ? html`<div className=${'text-xs ' + (tg.cluster ? 'up' : 'muted')} title="Open-market insider trades in the last 90 days (SEC Form 4)">${tg.cluster ? '\u25CF cluster buy \u00B7 ' : ''}${tg.text}</div>` : null; })()}</td>
              <td><span className=${'tag ' + ltRatingCls(r.rating)} style=${{ fontWeight: r.rating === 'Buy now' ? 600 : 400, borderColor: r.rating === 'Buy now' ? 'var(--up)' : 'var(--line)' }}>${r.rating}</span></td>
              <td className="num text-right">${fmtPx(r.price)}</td>
              <td><span className=${r.trend.score >= 35 ? 'up' : r.trend.score <= -35 ? 'down' : 'muted'}>${r.trend.label}</span></td>
              <td className="num text-right">${fmtPx(r.buy.b1.price)}<div className="muted text-xs">then ${fmtPx(r.buy.b2.price)}</div></td>
              <td className=${'num text-right ' + (r.buy.distance <= 0.02 && (r.rating === 'Buy now' || r.rating === 'Accumulate on dips') ? 'up' : 'muted')} title=${r.buy.distance <= 0.02 && r.rating !== 'Buy now' && r.rating !== 'Accumulate on dips' ? 'The price is at this level, but the rating says wait or avoid, so it is not a buy signal' : ''}>${r.buy.distance <= 0.02 ? 'in zone' : pctTxt(-r.buy.distance)}</td>
              <td className="num text-right down">${fmtPx(r.projection.trend.lowTypical)}<div className="text-xs">${pctTxt(downsideOf(r))}</div></td>
              <td className="num text-right up">${fmtPx(r.projection.trend.highTypical)}<div className="text-xs">${pctTxt(upsideOf(r))}</div></td>
              <td className="num text-right">${r.buy.rr == null ? '-' : r.buy.rr.toFixed(1) + ' : 1'}</td>
              <td className=${'num text-right ' + (r.ddNow <= -0.4 ? 'warn' : 'muted')}>${pctTxt(r.ddNow)}</td>
              <td className=${'num text-right ' + (r.vol.sigma > 0.6 ? 'warn' : 'muted')}>${(r.vol.sigma * 100).toFixed(0)}%</td>
            </tr>`;
          })}
        </tbody>
      </table>
    </div>

    ${sel && html`
    <div className="panel p-4 mb-4">
      <div className="flex flex-wrap justify-between gap-2 mb-2">
        <h2 className="text-lg font-semibold">${sel.symbol} <span className="muted text-sm font-normal">${trShort(sel.name)}</span> <span className=${'tag ml-2 ' + ltRatingCls(sel.rating)}>${sel.rating}</span></h2>
        <div className="muted text-sm">${sel.n} daily candles \u00B7 ${sel.years.toFixed(1)} years \u00B7 look-ahead ${sel.horizonMonths} months</div>
      </div>
      <div className="text-sm mb-3">${sel.ratingWhy}</div>
      ${sel.warnings.map((w, i) => html`<div key=${i} className="text-xs warn mb-1">\u25CF ${w}</div>`)}
      <div className="flex flex-wrap gap-6 mt-3">
        <div className="flex-[3] min-w-[320px]">
          <div dangerouslySetInnerHTML=${{ __html: window.innerWidth < 640 ? ltChartSvg(sel, 380, 250) : ltChartSvg(sel, 640, 240) }}></div>
          <div className="muted text-xs mt-1">White: price (2 years). Amber: 200-day average. Green band: buy zone. Blue fan: 10th to 90th percentile of simulated final prices. Dashed lines: predicted high (green) and low (red).</div>
        </div>
        <div className="flex-[2] min-w-[260px]">
          <div className="font-medium mb-1">Buy plan</div>
          <table className="w-full text-sm"><tbody>
            <tr><td className="muted !py-1">First buy price</td><td className="num text-right !py-1">${fmtPx(sel.buy.b1.price)}</td></tr>
            <tr><td colSpan="2" className="muted text-xs !pt-0 !pb-2">${sel.buy.b1.label}</td></tr>
            <tr><td className="muted !py-1">Second, deeper price</td><td className="num text-right !py-1">${fmtPx(sel.buy.b2.price)}</td></tr>
            <tr><td colSpan="2" className="muted text-xs !pt-0 !pb-2">${sel.buy.b2.label}</td></tr>
            <tr><td className="muted !py-1">Invalidation (thesis broken below)</td><td className="num text-right !py-1 down">${fmtPx(sel.buy.invalidation)}</td></tr>
            <tr><td className="muted !py-1">Reward : risk from the first price</td><td className="num text-right !py-1">${sel.buy.rr == null ? '-' : sel.buy.rr.toFixed(1) + ' : 1'}</td></tr>
          </tbody></table>
          <div className="muted text-xs mt-2">Idea: buy in steps rather than all at once, and re-check if the price closes below the invalidation level.</div>
        </div>
      </div>

      <div className="font-medium mt-4 mb-1">Projected range over ${sel.horizonMonths} months</div>
      <div className="overflow-x-auto"><table className="w-full text-sm">
        <thead><tr><th className="text-left"></th><th className="text-right" title="A low that only 1 simulated path in 10 goes below">Low (1 in 10)</th><th className="text-right" title="The lowest price a typical path touches">Predicted low</th><th className="text-right" title="The highest price a typical path touches">Predicted high</th><th className="text-right" title="A high that only 1 simulated path in 10 goes above">High (1 in 10)</th><th className="text-right" title="Price at the end of the look-ahead">End price: 10th / 50th / 90th</th></tr></thead>
        <tbody>${scen('With the past-year trend (half, capped)', sel.projection.trend)}${scen('No trend (neutral)', sel.projection.neutral)}</tbody></table></div>
      <div className="muted text-xs mt-1">Volatility ${(sel.vol.sigma * 100).toFixed(0)}% a year (${(sel.vol.y1 * 100).toFixed(0)}% over the last year, ${(sel.vol.m3 * 100).toFixed(0)}% over the last quarter). Trend used: ${pctTxt(sel.projection.g)} a year.</div>

      <div className="grid gap-6 mt-4 md:grid-cols-3 text-sm">
        <div><div className="font-medium mb-1">Why</div><ul className="space-y-1 muted" style=${{ listStyle: 'disc', paddingLeft: 18 }}>${sel.reasons.map((x, i) => html`<li key=${i}>${x}</li>`)}</ul></div>
        <div><div className="font-medium mb-1">Support levels below the price</div>
          ${sel.supports.length === 0 ? html`<div className="muted">None found nearby.</div>` : sel.supports.map((x, i) => html`<div key=${i} className="flex justify-between gap-3 py-0.5"><span className="muted">${x.label}</span><span className="num">${fmtPx(x.price)} <span className="muted">${pctTxt(x.price / sel.price - 1)}</span></span></div>`)}
          ${sel.resistances.length > 0 && html`<div className="font-medium mt-3 mb-1">Resistance above</div>${sel.resistances.map((x, i) => html`<div key=${i} className="flex justify-between gap-3 py-0.5"><span className="muted">${x.label}</span><span className="num">${fmtPx(x.price)} <span className="muted">${pctTxt(x.price / sel.price - 1)}</span></span></div>`)}`}</div>
        <div><div className="font-medium mb-1">Numbers</div>
          ${[['200-day average', sel.sma200], ['50-day average', sel.sma50], ['50-week average', sel.sma50w], ['52-week high', sel.high52], ['52-week low', sel.low52]].map(([l, v]) => html`<div key=${l} className="flex justify-between py-0.5"><span className="muted">${l}</span><span className="num">${v == null ? '-' : fmtPx(v)}</span></div>`)}
          <div className="flex justify-between py-0.5"><span className="muted">RSI daily / weekly</span><span className="num">${sel.rsiD == null ? '-' : sel.rsiD.toFixed(0)} / ${sel.rsiW == null ? '-' : sel.rsiW.toFixed(0)}</span></div>
          <div className="flex justify-between py-0.5"><span className="muted">Return 3 / 6 / 12 months</span><span className="num">${[sel.r3m, sel.r6m, sel.r12m].map(v => v == null ? '-' : pctTxt(v)).join(' / ')}</span></div>
          <div className="flex justify-between py-0.5"><span className="muted">Worst fall in the data</span><span className="num">${pctTxt(sel.maxDD)}</span></div>
          <div className="flex justify-between py-0.5"><span className="muted">Trend score</span><span className="num">${sel.trend.score}</span></div></div>
      </div>
      <div className="mt-6 pt-4" style=${{ borderTop: '1px solid var(--line)' }}>
        <div className="flex flex-wrap items-center gap-3 mb-1">
          <div className="font-medium">Ownership activity (SEC filings)</div>
          <button className="btn" disabled=${!!(sec[sel.symbol] && sec[sel.symbol].loading)} onClick=${() => loadSec(sel.symbol, !!(sec[sel.symbol] && sec[sel.symbol].data))}>${sec[sel.symbol] && sec[sel.symbol].loading ? 'Loading...' : sec[sel.symbol] && sec[sel.symbol].data ? 'Refresh' : 'Load SEC filings'}</button>
          ${sec[sel.symbol] && sec[sel.symbol].data && html`<span className="muted text-xs">${sec[sel.symbol].data.company} \u00B7 ${sec[sel.symbol].data.cached ? 'saved copy, ' : ''}checked ${fmtAge(Date.now() - sec[sel.symbol].at)} ago</span>`}
        </div>
        <div className="muted text-xs mb-2">Who is buying and selling the company's own stock, and who holds more than 5%. This is context, not a signal, and it does not change the rating.</div>
        ${sec[sel.symbol] && sec[sel.symbol].error && html`<div className=${'text-sm mb-2 ' + (sec[sel.symbol].setup ? 'warn' : 'down')}>${sec[sel.symbol].error}</div>`}
        ${(() => {
          const d = sec[sel.symbol] && sec[sel.symbol].data;
          if (!d) return html`<div className="muted text-sm">Press Load SEC filings. The first time takes several seconds, because each filing is read separately.</div>`;
          const ins = d.insiders, lines = secInsiderLines(ins), hl = secHolderLines(d.holders, Date.now());
          const fundRows = funds && funds.data && funds.data.configured ? funds.data.funds.map(f => ({ f, p: f.positions ? f.positions[sel.symbol] : null })) : [];
          return html`
            <div className="mb-2">${ins.clusterBuy && html`<span className="tag up mr-2">Cluster buy</span>`}${ins.officerBuy && html`<span className="tag up mr-2">Officer or director bought</span>`}</div>
            <ul className="text-sm space-y-1 mb-2" style=${{ listStyle: 'disc', paddingLeft: 18 }}>${[...lines, ...hl].map((x, i) => html`<li key=${i}>${x}</li>`)}</ul>
            ${(ins.truncated || ins.failed > 0 || ins.stopped || ins.ignored > 0) && html`<div className="muted text-xs mb-2">Read ${ins.read} of ${ins.filings} Form 4 filings in the last ${ins.days} days${ins.truncated ? ' (the newest ones, to keep it quick)' : ''}${ins.failed > 0 ? ', and ' + ins.failed + ' could not be read' : ''}. ${ins.ignored} award, option-exercise, tax or gift lines were ignored because they say nothing about conviction.${ins.stopped ? ' Stopped early: ' + ins.stopped + '.' : ''}</div>`}
            ${ins.trades.length > 0 && html`<div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr><th className="text-left">Date</th><th className="text-left">Who</th><th className="text-left">Trade</th><th className="text-right">Shares</th><th className="text-right">Price</th><th className="text-right">Value</th><th className="text-left">Plan</th><th></th></tr></thead><tbody>
              ${ins.trades.slice(0, 15).map((t, i) => html`<tr key=${i}><td className="num !py-1">${t.date}</td><td className="!py-1">${t.who}<div className="muted text-xs">${t.role}${t.direct ? '' : ' \u00B7 held indirectly'}${t.joint ? ' \u00B7 joint filing' : ''}</div></td>
                <td className=${'!py-1 ' + (t.code === 'P' ? 'up' : 'down')}>${t.code === 'P' ? 'Bought' : 'Sold'}</td><td className="num text-right !py-1">${Math.round(t.shares).toLocaleString('en-US')}</td><td className="num text-right !py-1">${t.price == null ? '-' : fmtPx(t.price)}</td><td className="num text-right !py-1">${secMoney(t.usd)}</td>

              ${d.holders.map((h, i) => html`<tr key=${i}><td className="num !py-1">${h.filed}</td><td className=${'!py-1 ' + (h.activist ? 'warn' : '')}>${h.form}</td><td className="!py-1">${h.holder || html`<span className="muted">open the filing for the name</span>`}</td><td className="num text-right !py-1">${h.percent != null ? h.percent + '%' : '-'}${h.shares != null ? html`<div className="muted text-xs">${Math.round(h.shares).toLocaleString('en-US')} shares</div>` : ''}</td><td className="!py-1"><a href=${h.url} target="_blank" rel="noopener noreferrer" className="muted underline">filing</a></td></tr>`)}</tbody></table></div>
              <div className="muted text-xs mt-1">A 13G is a passive holder, and a 13D can signal intent to influence the company. A list entry marked unreadable may include a filing the company itself made about another company.</div>`}
            <div className="font-medium mt-4 mb-1">Fund watch (Form 13F)</div>
            ${!(funds && funds.data && funds.data.configured) ? html`<div className="muted text-sm">${funds && funds.error ? funds.error : 'Off. Fund holdings are filed per fund, not per company, so EDGAR cannot list who owns a stock. Set SEC_FUNDS on the Worker to the funds you want to follow (their CIK numbers), then press Load SEC filings for all.'}</div>` : html`
              <div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr><th className="text-left">Fund</th><th className="text-left">Quarter</th><th className="text-right">Shares</th><th className="text-right">Change</th></tr></thead><tbody>

                <td className="num text-right !py-1">${p ? Math.round(p.shares).toLocaleString('en-US') : html`<span className="muted">not found</span>`}</td>
                <td className=${'num text-right !py-1 ' + (p && p.isNew ? 'up' : p && p.change != null ? (p.change > 0.005 ? 'up' : p.change < -0.005 ? 'down' : 'muted') : 'muted')}>${p ? (p.isNew ? 'new position' : p.change == null ? '-' : ltPctText(p.change, 0)) : ''}</td></tr>`)}</tbody></table></div>
              <div className="muted text-xs mt-1">13F filings show holdings at the end of a quarter and arrive up to 45 days later, so they are stale by the time you see them. Companies are matched by name, so "not found" can also mean the name did not match.</div>`}
            <div className="muted text-xs mt-3">Insider purchases are the informative part: in studies they predicted modestly better returns over the following months, mostly in smaller companies, while sales mostly reflect tax and diversification. Large companies like most of your list show the weakest effect. Past patterns are not a promise.</div>`;

    <div className="panel p-4 text-sm muted leading-relaxed">

const LongTermTabMemo = React.memo(LongTermTab);

/* =====================================================================
   APP
===================================================================== */
function App() {
  const [settings, setSettings] = useState(() => {
    const s = loadJSON(LS.settings, {});
    return { ...DEFAULTS, ...s, enabled: { ...DEFAULTS.enabled, ...(s.enabled || {}) } };
  });
  const settingsRef = useRef(settings); settingsRef.current = settings;
  useEffect(() => saveJSON(LS.settings, settings), [settings]);
  const upd = (k, v) => setSettings(s => ({ ...s, [k]: v }));

  const cache = useMemo(() => loadJSON(LS.cache, {}), []);
  const [rows, setRows] = useState(cache.rows || {});
  const [drivers, setDrivers] = useState(cache.drivers || {});
  const rowsRef = useRef(rows); rowsRef.current = rows;
  const driversRef = useRef(drivers); driversRef.current = drivers;
  const [journal, setJournal] = useState(() => loadJSON(LS.journal, []));
  const journalRef = useRef(journal); journalRef.current = journal;
  useEffect(() => saveJSON(LS.journal, journal), [journal]);
  const [events, setEvents] = useState(() => loadJSON(LS.events, []));
  const eventsRef = useRef(events); eventsRef.current = events;
  useEffect(() => saveJSON(LS.events, events), [events]);

  const [busy, setBusy] = useState(false);
  const busyRef = useRef(false);
  const [status, setStatus] = useState({ msg: '', error: false });
  const [now, setNow] = useState(Date.now());
  const [sort, setSort] = useState({ key: 'lean', dir: 'desc' });
  const [selected, setSelected] = useState('XAUUSD');
  const [showSettings, setShowSettings] = useState(!loadJSON(LS.settings, null));
  const [tab, setTab] = useState('scanner');
  const [evInput, setEvInput] = useState({ when: '', label: '' });
  const [basket, setBasket] = useState(() => loadJSON(LS.basket, []));
  useEffect(() => saveJSON(LS.basket, basket), [basket]);
  const addToBasket = (market, dir) => setBasket(b => [...b.filter(x => x.market !== market), { id: market + '-' + dir, market, dir, riskPct: settingsRef.current.riskPct }]);

  useEffect(() => { const i = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(i); }, []);

  /* ----- refresh ----- */
  const refresh = useCallback(async () => {
    if (busyRef.current) return;
    const s = settingsRef.current;
    const needsCreds = s.provider === 'oanda' ? !(s.oandaToken.trim() || s.proxyUrl.trim()) : !s.tdKey.trim();
    if (needsCreds) {
      setStatus({ msg: s.provider === 'oanda' ? 'Add your OANDA token (or proxy URL) in Settings first.' : 'Add your Twelve Data API key in Settings first.', error: true });
      setShowSettings(true);
      return;
    }
    busyRef.current = true; setBusy(true);

    const gm = GRAN_MIN[s.gran];
    const count = Math.min(5000, Math.ceil(7 * 1440 / gm));
    const spacing = s.provider === 'oanda' ? 120 : 8000;   // Twelve Data free plan is ~8 requests/minute
    const symOf = (x) => s.provider === 'oanda' ? x.oanda : x.td;

    const queue = [
      ...MARKETS.filter(m => s.enabled[m.id]).map(m => ({ ...m, kind: 'market' })),
      ...(s.drivers ? DRIVERS.filter(d => symOf(d)).map(d => ({ ...d, kind: 'driver' })) : [])
    ];

    const candlesMap = {};
    const errors = [];
    const newRows = {}, newDrivers = {};
    for (let i = 0; i < queue.length; i++) {
      const item = queue[i];
      setStatus({ msg: 'Fetching ' + item.name + ' (' + (i + 1) + '/' + queue.length + ')', error: false });
      let result;
      try {
        const candles = s.provider === 'oanda' ? await fetchOanda(symOf(item), s, count) : await fetchTwelveData(symOf(item), s, count);
        result = analyze(candles, s, item.fallbackSpread || 0, Date.now());
        if (!result.error) candlesMap[item.id] = candles;
      } catch (e) {
        result = { error: String(e.message || e) + (e instanceof TypeError ? ' (network/CORS blocked - see the proxy note in Settings)' : '') };
      }
      if (result.error) errors.push(item.name + ': ' + result.error);
      const setter = item.kind === 'market' ? setRows : setDrivers;
      (item.kind === 'market' ? newRows : newDrivers)[item.id] = result;
      setter(prev => ({ ...prev, [item.id]: result }));
      if (i < queue.length - 1) await sleep(spacing);
    }

    /* ----- journal: resolve open entries, then log fresh actionable setups ----- */
    const nowMs = Date.now();
    const evs = eventsRef.current;
    const blackout = evs.some(e => nowMs >= e.ts - 15 * 60000 && nowMs <= e.ts + 5 * 60000);
    let j = journalRef.current.map(e => (e.status === 'open' && candlesMap[e.market]) ? evalEntry(e, candlesMap[e.market], nowMs, s.expireHours) : e);
    let logged = 0;
    for (const m of MARKETS) {
      const a = newRows[m.id];
      if (!a || a.error) continue;
      const ok = a.actionable && !blackout && (nowMs - a.lastT) <= staleMs(s) && a.spread <= 0.25 * a.atr;
      if (!ok) continue;
      if (j.some(e => e.market === m.id && e.dir === a.dir && nowMs - e.ts < 60 * 60000)) continue;
      const p = tradePlan(a, s, a.dir);
      j.push({ id: m.id + '-' + nowMs, ts: nowMs, market: m.id, dir: a.dir, setup: a.setup, score: a.lean, entry: p.entry, stop: p.stop, t1: p.t1, t2: p.t2, atr: a.atr, stopMult: s.stopMult, spread: a.spread, lastT: a.lastT, status: 'open', r: null });
      logged++;
    }
    j = j.slice(-500);
    journalRef.current = j; setJournal(j);

    // cache fresh (non-error) results only
    const good = (o) => Object.fromEntries(Object.entries(o).filter(([, v]) => v && !v.error));
    saveJSON(LS.cache, { rows: good({ ...rowsRef.current, ...newRows }), drivers: good({ ...driversRef.current, ...newDrivers }) });

    busyRef.current = false; setBusy(false);
    setStatus({
      msg: 'Updated ' + (queue.length - errors.length) + '/' + queue.length + ' at ' + fmtMel(Date.now()) + (logged ? ' - ' + logged + ' new journal entr' + (logged > 1 ? 'ies' : 'y') : ''),
      error: errors.length > 0, detail: errors
    });
  }, []);

  useEffect(() => {
    if (!settings.auto) return;
    const i = setInterval(() => { if (!document.hidden) refresh(); }, Math.max(15, settings.refreshSec) * 1000);
    return () => clearInterval(i);
  }, [settings.auto, settings.refreshSec, refresh]);

  /* ----- derived ----- */
  const sessionList = useMemo(() => Object.keys(SESSIONS).map(k => sessionInfo(k, now)), [Math.floor(now / 30000)]);
  const sessionOpen = Object.fromEntries(sessionList.map(x => [x.key, x.isOpen]));
  const activeEvent = events.find(e => now >= e.ts - 15 * 60000 && now <= e.ts + 5 * 60000);
  const nextEvent = events.filter(e => e.ts > now).sort((a, b) => a.ts - b.ts)[0];

  const tableRowsBase = useMemo(() => {
    const list = MARKETS.filter(m => settings.enabled[m.id]).map(m => {
      const a = rows[m.id];
      const ok = a && !a.error;
      const stale = ok && (now - a.lastT) > staleMs(settings);
      const dataOld = ok && (now - a.fetchedAt) > 180000;
      const wide = ok && a.spread > 0.25 * a.atr;
      const core = m.sessions.some(k => sessionOpen[k]);
      const tradeable = ok && a.actionable && !stale && !dataOld && !wide && !activeEvent;
      return { m, a, ok, stale, dataOld, wide, core, tradeable,
        chgAtr: ok ? (a.price - a.dayOpen) / a.atr : null,
        spreadPct: ok ? a.spread / a.atr : null,
        absLean: ok ? Math.abs(a.lean) : null };
    });
    const key = sort.key;
    const val = (r) => key === 'name' ? r.m.name : key === 'lean' ? (r.ok ? (r.a.actionable ? 1000 : 0) + r.absLean : null)
      : key === 'chgAtr' ? r.chgAtr : key === 'dev' ? (r.ok ? r.a.dev : null) : key === 'spreadPct' ? r.spreadPct
      : key === 'rsi' ? (r.ok ? r.a.rsi : null) : key === 'adx' ? (r.ok ? r.a.adx : null) : key === 'rvol' ? (r.ok ? r.a.rvol : null) : null;
    return list.sort((x, y) => {
      const a = val(x), b = val(y);
      if (a == null && b == null) return 0;
      if (a == null) return 1;
      if (b == null) return -1;
      const c = typeof a === 'string' ? a.localeCompare(b) : a - b;
      return sort.dir === 'asc' ? c : -c;
    });
  }, [rows, settings, sort, now, activeEvent, sessionOpen.tokyo, sessionOpen.hk, sessionOpen.shanghai, sessionOpen.london, sessionOpen.ny]);

  /* ----- risk + recommendations ----- */
  const eventMinutes = nextEvent ? (nextEvent.ts - now) / 60000 : null;
  const ctxFor = (r) => ({ core: r.core, stale: r.stale, dataOld: r.dataOld, eventActive: !!activeEvent, eventMinutes, weekendGap: isWeekendGapRisk(now), equity: settings.equity, riskPct: settings.riskPct, stopMult: settings.stopMult });
  const riskFor = (r, dir) => r.ok ? riskAssess(r.a, dir, ctxFor(r)) : null;
  const suggDir = (a) => a.dir || (a.lean >= 0 ? 1 : -1);
  const tableRows = tableRowsBase.map(r => r.ok ? { ...r, risk: riskFor(r, suggDir(r.a)) } : r);

  const candidates = tableRows.filter(r => r.tradeable && r.risk.level !== 'Very high')
    .map(r => ({ r, rank: Math.abs(r.a.lean) - r.risk.score * 0.5 })).sort((x, y) => y.rank - x.rank).slice(0, 3);
  const candidateIds = new Set(candidates.map(c => c.r.m.id));
  const readyCount = tableRows.filter(r => r.tradeable).length;
  const standAside = tableRows.filter(r => !candidateIds.has(r.m.id)).map(r => {
    if (!r.ok) return { r, score: -1, reason: (r.a && r.a.error) ? r.a.error : 'No data yet' };
    if (r.tradeable) return { r, score: Math.abs(r.a.lean), reason: 'Setup is ready, but risk is ' + r.risk.level.toLowerCase() + (r.risk.factors[0] ? ': ' + r.risk.factors[0].text : '') };
    return { r, score: Math.abs(r.a.lean), reason: blockers(r.a, { stale: r.stale, dataOld: r.dataOld, event: !!activeEvent, wide: r.wide, core: r.core }, settings.minScore)[0] || 'No edge right now' };
  }).sort((x, y) => y.score - x.score);

  const basketInfo = {};
  basket.forEach(p => { const r = tableRows.find(x => x.m.id === p.market); if (r && r.ok) basketInfo[p.market] = { a: r.a, risk: riskFor(r, p.dir) }; });
  const ba = basket.length ? basketAssess(basket, { equity: settings.equity, stopMult: settings.stopMult, dailyLossPct: settings.dailyLossPct, leverage: settings.leverage, eventActive: !!activeEvent }, basketInfo) : null;
  const sevStyle = (n) => ({ color: n === 2 ? 'var(--down)' : n === 1 ? 'var(--warn)' : 'var(--up)' });
  const riskCls = (lvl) => lvl === 'Low' ? 'up' : lvl === 'High' ? 'warn' : lvl === 'Very high' ? 'down' : '';
  const signalFor = (r) => r.ok ? signalLabel(r.a, r.tradeable && r.risk.level !== 'Very high') : null;
  const signalBadge = (r) => { const sg = signalFor(r); return sg ? html`<span className=${'tag ' + sg.cls} style=${{ fontWeight: sg.strong ? 600 : 400, borderColor: sg.tier === 0 ? 'var(--line)' : (sg.tier > 0 ? 'var(--up)' : 'var(--down)') }} title=${sg.note}>${sg.label}</span>` : null; };
  const riskBadge = (rk) => rk ? html`<span className=${'tag ' + riskCls(rk.level)} title=${rk.factors.slice(0, 4).map(f => f.label + ' +' + f.pts).join('\n') || 'No risk flags'}>${rk.level} ${rk.score}</span>` : null;

  const headerClick = (key) => setSort(s => s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: key === 'name' ? 'asc' : 'desc' });
  const arrow = (key) => sort.key === key ? (sort.dir === 'asc' ? ' \u25B2' : ' \u25BC') : '';
  const th = (key, label, title, align) => html`<th className=${'sortable ' + (align || 'text-right')} tabIndex="0" title=${title || ''} onClick=${() => headerClick(key)} onKeyDown=${(e) => e.key === 'Enter' && headerClick(key)}>${label}${arrow(key)}</th>`;

  const anyData = Object.values(rows).some(r => r && !r.error);
  const oldestFetch = Math.min(...Object.values(rows).filter(r => r && !r.error).map(r => r.fetchedAt), Infinity);
  const showCachedBanner = anyData && !busy && (now - oldestFetch) > 180000;

  const sel = tableRows.find(r => r.m.id === selected) || tableRows[0];
  const stats = useMemo(() => journalStats(journal), [journal]);

  const addEvent = () => {
    if (!evInput.when) return;
    const ts = new Date(evInput.when).getTime();
    if (isNaN(ts)) return;
    setEvents(es => [...es, { id: 'e' + ts + Math.random().toString(36).slice(2, 6), ts, label: evInput.label.trim() || 'Event' }].sort((a, b) => a.ts - b.ts));
    setEvInput({ when: '', label: '' });
  };

  const exportCSV = () => {
    const head = ['time_melbourne', 'market', 'direction', 'setup', 'score', 'entry', 'stop', 'target_2R', 'status', 'R'];
    const lines = journal.map(e => [fmtMelFull(e.ts), e.market, e.dir > 0 ? 'long' : 'short', e.setup, e.score, e.entry, e.stop, e.t2, e.status, e.r == null ? '' : e.r.toFixed(2)].join(','));
    const blob = new Blob([[head.join(','), ...lines].join('\n')], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'scanner-journal.csv'; a.click();
  };

  /* ----- small render helpers ----- */
  const leanBar = (v) => html`
    <div className="flex items-center gap-2 justify-center">
      <div style=${{ width: 80, height: 8, background: 'var(--ink)', border: '1px solid var(--line)', position: 'relative', borderRadius: 2 }}>
        <div style=${{ position: 'absolute', top: 0, bottom: 0, left: v >= 0 ? '50%' : (50 + v / 2) + '%', width: Math.abs(v) / 2 + '%', background: v >= 0 ? 'var(--up)' : 'var(--down)' }}></div>
        <div style=${{ position: 'absolute', top: -2, bottom: -2, left: '50%', width: 1, background: 'var(--muted)' }}></div>
      </div>
      <span className=${'num w-9 text-right ' + (v > 0 ? 'up' : v < 0 ? 'down' : 'muted')}>${fmtSigned(v, 0)}</span>
    </div>`;

  const planCol = (r, dir) => {
