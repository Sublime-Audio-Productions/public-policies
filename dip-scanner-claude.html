<script>
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const html = htm.bind(React.createElement);

/* =====================================================================

   ---------------------------------------------------------------------

   td    : Twelve Data symbol (best guess - index symbols and free-plan

===================================================================== */

  { id: 'XAGUSD', name: 'Silver',        oanda: 'XAG_USD',    td: 'XAG/USD', sessions: ['london', 'ny'],      fallbackSpread: 0.03 },

  { id: 'JP225',  name: 'Japan 225',     oanda: 'JP225_USD',  td: 'N225',    sessions: ['tokyo'],             fallbackSpread: 8 },
  { id: 'HK50',   name: 'Hong Kong 50',  oanda: 'HK33_USD',   td: 'HSI',     sessions: ['hk'],                fallbackSpread: 8 },
  { id: 'CN50',   name: 'China 50',      oanda: 'CN50_USD',   td: 'XIN9',    sessions: ['shanghai', 'hk'],    fallbackSpread: 10 },

];

// Cross-market drivers (context only, never scored or journaled)
const DRIVERS = [
  { id: 'USDJPY', name: 'USD/JPY',  oanda: 'USD_JPY',     td: 'USD/JPY', note: 'Higher USD/JPY usually supports Japan 225' },
  { id: 'USDCNH', name: 'USD/CNH',  oanda: 'USD_CNH',     td: 'USD/CNH', note: 'Higher = weaker yuan, often risk-off for China 50 / HK 50' },
  { id: 'US10Y',  name: 'US 10Y T-Note (price)', oanda: 'USB10Y_USD', td: null, note: 'Bond price: falling price = rising yield, which tends to pressure gold and silver' }
];

const SESSIONS = {
  tokyo:    { label: 'Tokyo',     tz: 'Asia/Tokyo',       open: [9, 0],  close: [15, 30] },
  hk:       { label: 'Hong Kong', tz: 'Asia/Hong_Kong',   open: [9, 30], close: [16, 0] },
  shanghai: { label: 'Shanghai',  tz: 'Asia/Shanghai',    open: [9, 30], close: [15, 0] },
  london:   { label: 'London',    tz: 'Europe/London',    open: [8, 0],  close: [16, 30] },
  ny:       { label: 'New York',  tz: 'America/New_York', open: [9, 30], close: [16, 0] }
};

const GRAN_MIN = { M1: 1, M5: 5, M15: 15 };
const TD_INTERVAL = { M1: '1min', M5: '5min', M15: '15min' };

const DEFAULTS = {
  provider: 'oanda',        // 'oanda' | 'twelvedata'
  oandaEnv: 'practice',
  oandaToken: '',
  proxyUrl: '',
  tdKey: '',
  gran: 'M15',
  rolloverUtc: 21,          // hour (UTC) when your "trading day" starts. 21 = 5pm New York during US daylight time, 22 in winter
  equity: 10000,
  riskPct: 0.5,
  stopMult: 1,              // stop distance in ATRs
  minScore: 40,             // minimum |lean| for a setup to count as actionable
  expireHours: 4,           // journal entries not resolved by then are closed at market
  dailyLossPct: 2,          // your own daily loss limit, % of equity (used by the risk basket)
  leverage: 20,             // ASSUMED leverage for margin estimates. Set to your broker's real rate for each product
  refreshSec: 30,
  auto: false,
  drivers: true,
  enabled: Object.fromEntries(MARKETS.map(m => [m.id, true]))
};

const LS = { settings: 'dts2_settings', journal: 'dts2_journal', events: 'dts2_events', cache: 'dts2_cache', basket: 'dts2_basket' };

/*PURE_START*/
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* ---------- indicators ---------- */
function emaLast(vals, n) {
  if (!vals.length) return null;
  const seed = Math.min(n, vals.length);
  const k = 2 / (n + 1);
  let e = avg(vals.slice(0, seed));
  for (let i = seed; i < vals.length; i++) e = vals[i] * k + e * (1 - k);
  return e;
}

function rsiWilder(closes, n = 14) {
  if (closes.length <= n) return null;
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) { const d = closes[i] - closes[i - 1]; if (d > 0) g += d; else l -= d; }
  g /= n; l /= n;
  for (let i = n + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    g = (g * (n - 1) + Math.max(d, 0)) / n;
    l = (l * (n - 1) + Math.max(-d, 0)) / n;
  }
  if (l === 0) return g === 0 ? 50 : 100;
  return 100 - 100 / (1 + g / l);
}

function trueRanges(c) {
  const tr = [];
  for (let i = 1; i < c.length; i++) {
    tr.push(Math.max(c[i].h - c[i].l, Math.abs(c[i].h - c[i - 1].c), Math.abs(c[i].l - c[i - 1].c)));
  }
  return tr;
}

function atrWilder(c, n = 14) {
  const tr = trueRanges(c);
  if (tr.length < n) return null;
  let a = avg(tr.slice(0, n));
  for (let i = n; i < tr.length; i++) a = (a * (n - 1) + tr[i]) / n;
  return a;
}

function adxWilder(c, n = 14) {
  if (c.length < 2 * n + 2) return null;
  const tr = trueRanges(c), pdm = [], ndm = [];
  for (let i = 1; i < c.length; i++) {
    const up = c[i].h - c[i - 1].h, dn = c[i - 1].l - c[i].l;
    pdm.push(up > dn && up > 0 ? up : 0);
    ndm.push(dn > up && dn > 0 ? dn : 0);
  }
  const sum = (a, from, to) => a.slice(from, to).reduce((x, y) => x + y, 0);
  let sTR = sum(tr, 0, n), sP = sum(pdm, 0, n), sN = sum(ndm, 0, n);
  const dx = [];
  const pushDx = () => {
    const pdi = 100 * sP / sTR, ndi = 100 * sN / sTR, s = pdi + ndi;
    dx.push(s === 0 ? 0 : 100 * Math.abs(pdi - ndi) / s);
  };
  pushDx();
  for (let i = n; i < tr.length; i++) {
    sTR = sTR - sTR / n + tr[i];
    sP = sP - sP / n + pdm[i];
    sN = sN - sN / n + ndm[i];
    pushDx();
  }
  if (dx.length < n) return null;
  let adx = avg(dx.slice(0, n));
  for (let i = n; i < dx.length; i++) adx = (adx * (n - 1) + dx[i]) / n;
  return adx;
}

/* ---------- main analysis: candles -> metrics, levels, lean, setup ----------
   candle = { t(ms), o, h, l, c, v, bid, ask }                                  */
function analyze(candles, s, fallbackSpread, nowMs) {
  const gm = GRAN_MIN[s.gran];
  if (candles.length < 60) return { error: 'Only ' + candles.length + ' candles returned (need 60+)' };

  const roll = s.rolloverUtc * 3600000;
  const dayKey = (t) => Math.floor((t - roll) / 86400000);
  const offset = (t) => (((t - roll) % 86400000) + 86400000) % 86400000;

  const last = candles[candles.length - 1];
  const price = last.c;
  const todayKey = dayKey(last.t);

  const days = new Map();
  for (const c of candles) {
    const k = dayKey(c.t);
    if (!days.has(k)) days.set(k, []);
    days.get(k).push(c);
  }
  const today = days.get(todayKey);
  const prevKeys = [...days.keys()].filter(k => k < todayKey).sort((a, b) => b - a);
  const prevComplete = prevKeys.filter(k => days.get(k).length >= 20);

  let pdh = null, pdl = null, pdc = null;
  if (prevComplete.length) {
    const pc = days.get(prevComplete[0]);
    pdh = Math.max(...pc.map(c => c.h));
    pdl = Math.min(...pc.map(c => c.l));
    pdc = pc[pc.length - 1].c;
  }

  const closes = candles.map(c => c.c);
  const atr = atrWilder(candles, 14);
  const rsi = rsiWilder(closes, 14);
  const adx = adxWilder(candles, 14);
  const ema20 = emaLast(closes, 20);
  const ema50 = emaLast(closes, 50);
  if (atr == null || rsi == null || adx == null || atr <= 0) return { error: 'Not enough history for indicators' };

  const dayOpen = today[0].o;
  const dayHigh = Math.max(...today.map(c => c.h));
  const dayLow = Math.min(...today.map(c => c.l));

  // Session VWAP (tick volume weighted). Falls back to a plain typical-price average if no volume.
  let pv = 0, vv = 0, tpSum = 0;
  for (const c of today) { const tp = (c.h + c.l + c.c) / 3; pv += tp * c.v; vv += c.v; tpSum += tp; }
  const vwap = vv > 0 ? pv / vv : tpSum / today.length;

  // Relative volume vs same time of day on up to 5 prior days (cumulative since rollover)
  const curOff = offset(last.t);
  const cum = (k) => days.get(k).reduce((a, c) => offset(c.t) <= curOff ? a + c.v : a, 0);
  const todayCum = cum(todayKey);
  const priorCums = prevComplete
    .filter(k => offset(days.get(k)[0].t) <= 3 * 3600000)   // skip days cut off by the fetch window
    .slice(0, 5).map(cum).filter(x => x > 0);
  const rvol = (priorCums.length >= 2 && todayCum > 0) ? todayCum / avg(priorCums) : null;

  const haveRealSpread = last.ask != null && last.bid != null && last.ask > last.bid;
  const spread = haveRealSpread ? last.ask - last.bid : fallbackSpread;

  /* ----- lean: -100 (short) .. +100 (long), regime-aware ----- */
  const regime = adx >= 22 ? 'Trend' : adx < 20 ? 'Range' : 'Transition';
  const ranging = adx < 20;
  const dev = (price - vwap) / atr;
  const tNorm = clamp((ema20 - ema50) / atr, -1.5, 1.5) / 1.5;
  const strength = clamp((adx - 15) / 20, 0, 1);
  const flip = ranging ? -1 : 1;                             // in a range, stretch = fade; in a trend, stretch = continuation
  const trendPts = 35 * tNorm * (0.4 + 0.6 * strength);
  const vwapPts = flip * 25 * clamp(dev, -2, 2) / 2;
  const momPts = flip * 20 * clamp((price - dayOpen) / atr, -3, 3) / 3;
  const rsiPts = ranging ? -20 * clamp((rsi - 50) / 25, -1, 1) : 10 * clamp((rsi - 50) / 25, -1, 1);
  let lean = trendPts + vwapPts + momPts + rsiPts;

  /* ----- setup classification ----- */
  let setup = 'No setup', dir = 0, entryType = false;
  // Fading an extreme is only allowed when the trend is not strong (ADX < 35); otherwise it is catching a falling knife
  const exhaust = adx < 35 && Math.abs(dev) >= 2.2 && ((dev > 0 && rsi >= 75) || (dev < 0 && rsi <= 25));
  if (exhaust) {
    dir = dev > 0 ? -1 : 1;
    setup = dir > 0 ? 'Exhaustion long' : 'Exhaustion short';
    entryType = true;
    lean = dir * clamp(50 + (Math.abs(dev) - 2.2) * 10 + (Math.abs(rsi - 50) - 25) * 0.8, 50, 100);
  } else if (pdh != null && adx >= 20 && price > pdh && price <= pdh + 1.2 * atr) {
    dir = 1; setup = 'Breakout long'; entryType = true;
  } else if (pdl != null && adx >= 20 && price < pdl && price >= pdl - 1.2 * atr) {
    dir = -1; setup = 'Breakout short'; entryType = true;
  } else if (adx >= 22 && ema20 > ema50 && price > ema50 && (price <= ema20 + 0.25 * atr || rsi <= 45)) {
    dir = 1; setup = 'Pullback long'; entryType = true;
  } else if (adx >= 22 && ema20 < ema50 && price < ema50 && (price >= ema20 - 0.25 * atr || rsi >= 55)) {
    dir = -1; setup = 'Pullback short'; entryType = true;
  } else if (adx < 20 && dev <= -1.5 && rsi < 35) {
    dir = 1; setup = 'Range fade long'; entryType = true;
  } else if (adx < 20 && dev >= 1.5 && rsi > 65) {
    dir = -1; setup = 'Range fade short'; entryType = true;
  } else if (adx >= 22 && ema20 > ema50) {
    dir = 1; setup = 'Trend long (extended)';
  } else if (adx >= 22 && ema20 < ema50) {
    dir = -1; setup = 'Trend short (extended)';
  }
  lean = Math.round(clamp(lean, -100, 100));
  const actionable = entryType && dir !== 0 && Math.sign(lean) === dir && Math.abs(lean) >= s.minScore;

  return {
    price, dayOpen, dayHigh, dayLow, vwap, ema20, ema50, rsi, atr, adx, rvol,
    spread, spreadReal: haveRealSpread, pdh, pdl, pdc,
    lean, setup, dir, entryType, actionable, regime, dev,
    parts: { trend: trendPts, vwap: vwapPts, momentum: momPts, rsi: rsiPts },
    lastT: last.t, fetchedAt: nowMs
  };
}

/* ---------- risk / trade plan ---------- */
function tradePlan(a, s, dir) {
  const risk = s.equity * s.riskPct / 100;
  const R = a.atr * s.stopMult;
  const perUnit = R + a.spread;                       // price risk plus the spread you pay to get in
  const units = Math.floor(risk / perUnit * 100) / 100;
  return {
    risk, R, units,
    entry: a.price, stop: a.price - dir * R,
    t1: a.price + dir * R, t2: a.price + dir * 2 * R,
    spreadCost: units * a.spread, notional: units * a.price
  };
}

/* ---------- journal outcome: -1R at stop, +2R at target, else close at expiry ---------- */
function evalEntry(e, candles, nowMs, expireHours) {
  const R = e.atr * e.stopMult;
  const expireMs = expireHours * 3600000;
  for (const c of candles) {
    if (c.t <= e.lastT) continue;
    const hitStop = e.dir > 0 ? c.l <= e.stop : c.h >= e.stop;
    const hitTarget = e.dir > 0 ? c.h >= e.t2 : c.l <= e.t2;
    if (hitStop) return { ...e, status: 'stop', r: -1, closedAt: c.t };   // if both hit in one candle, assume stop first
    if (hitTarget) return { ...e, status: 'target', r: 2, closedAt: c.t };
    if (c.t - e.ts > expireMs) return { ...e, status: 'expired', r: clamp(e.dir * (c.c - e.entry) / R, -1, 2), closedAt: c.t };
  }
  if (nowMs - e.ts > expireMs && candles.length) {
    const c = candles[candles.length - 1];
    return { ...e, status: 'expired', r: clamp(e.dir * (c.c - e.entry) / R, -1, 2), closedAt: c.t };
  }
  return e;
}

function journalStats(journal) {
  const closed = journal.filter(e => e.status !== 'open');
  const mk = (list) => ({
    n: list.length,
    win: list.length ? list.filter(e => e.r > 0).length / list.length : null,
    avgR: list.length ? avg(list.map(e => e.r)) : null
  });
  return {
    open: journal.length - closed.length,
    all: mk(closed),
    buckets: [
      { label: '40-59', ...mk(closed.filter(e => Math.abs(e.score) < 60)) },
      { label: '60-79', ...mk(closed.filter(e => Math.abs(e.score) >= 60 && Math.abs(e.score) < 80)) },
      { label: '80+',   ...mk(closed.filter(e => Math.abs(e.score) >= 80)) }
    ]
  };
}

/* ---------- sessions (DST-correct via Intl) ---------- */
const _dtfCache = {};   // building an Intl.DateTimeFormat is slow, so build each one once
function cachedDtf(key, tz, opts) { const k = key + '|' + tz; return _dtfCache[k] || (_dtfCache[k] = new Intl.DateTimeFormat('en-US', { timeZone: tz, ...opts })); }
function tzOffsetMs(tz, t) {
  const p = cachedDtf('full', tz, { hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
    .formatToParts(new Date(t)).reduce((o, x) => (o[x.type] = x.value, o), {});
  const asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
  return asUtc - Math.floor(t / 1000) * 1000;
}

function sessionInfo(key, nowMs) {
  const s = SESSIONS[key];
  const p = cachedDtf('date', s.tz, { year: 'numeric', month: '2-digit', day: '2-digit' })
    .formatToParts(new Date(nowMs)).reduce((o, x) => (o[x.type] = x.value, o), {});
  const y = +p.year, m = +p.month - 1, d = +p.day;
  const toUtc = (hm) => { const g = Date.UTC(y, m, d, hm[0], hm[1]); return g - tzOffsetMs(s.tz, g); };
  const open = toUtc(s.open), close = toUtc(s.close);
  const dow = new Date(Date.UTC(y, m, d)).getUTCDay();
  const weekday = dow !== 0 && dow !== 6;
  return { key, label: s.label, openT: open, closeT: close, isOpen: weekday && nowMs >= open && nowMs < close };
}

/* ---------- risk assessment & recommendations ---------- */
const CLUSTERS = { NAS100: 'US equities', SPX500: 'US equities', JP225: 'Asia equities', HK50: 'Asia equities', CN50: 'Asia equities', XAUUSD: 'Metals', XAGUSD: 'Metals', WTI: 'Oil' };

function isWeekendGapRisk(nowMs) { const d = new Date(nowMs); return d.getUTCDay() === 5 && d.getUTCHours() >= 18; }

// Nearest known level in the direction of the trade (a level that could stall the move)
function nearestObstacle(a, dir) {
  const levels = [['VWAP', a.vwap], ['the day high', a.dayHigh], ['the day low', a.dayLow], ['the prior day high', a.pdh],
    ['the prior day low', a.pdl], ['the prior day close', a.pdc], ['EMA 50', a.ema50]].filter(x => x[1] != null);
  let best = null;
  for (const [name, v] of levels) {
    const d = (v - a.price) * dir;
    if (d > a.atr * 0.05 && (best == null || d < best.d)) best = { name, v, d };
  }
  return best;
}

// ctx: { core, stale, dataOld, eventActive, eventMinutes, weekendGap, equity, riskPct, stopMult }
function riskAssess(a, dir, ctx) {
  const R = a.atr * ctx.stopMult;
  const f = [];
  const add = (pts, label, text) => { if (pts > 0) f.push({ pts, label, text }); };
  const cost = a.spread / R;
  add(cost > 0.25 ? 25 : cost > 0.15 ? 15 : cost > 0.08 ? 8 : 0, 'Spread', 'Spread is ' + (cost * 100).toFixed(0) + '% of your stop distance, and you pay it on every trade');
  const adev = Math.abs(a.dev);
  add(adev > 2.5 ? 15 : adev > 1.5 ? 8 : 0, 'Extended', 'Price is ' + adev.toFixed(1) + ' ATR from VWAP, so entering here is chasing a stretched move');
  if (!ctx.core) add(20, 'Off-hours', 'Outside this market\'s core session: thinner liquidity, wider spreads and gaps are more likely');
  if (ctx.eventActive) add(40, 'Event window', 'Inside a no-trade window around a scheduled event');
  else if (ctx.eventMinutes != null && ctx.eventMinutes <= 60) add(ctx.eventMinutes <= 30 ? 25 : 15, 'Event soon', 'A scheduled event is about ' + Math.round(ctx.eventMinutes) + ' min away, and price can jump through a stop');
  if (ctx.weekendGap) add(20, 'Weekend gap', 'Markets close for the weekend soon, and a position held over it can gap past your stop');
  const trendDir = a.ema20 > a.ema50 ? 1 : -1;
  if (a.adx >= 22 && dir !== trendDir) add(a.adx >= 30 ? 25 : 18, 'Against trend', 'This trade opposes a trend with ADX ' + a.adx.toFixed(0) + ', and counter-trend trades fail more often');
  const ob = nearestObstacle(a, dir);
  if (ob) { const dR = ob.d / R; add(dR < 1 ? 15 : dR < 2 ? 6 : 0, 'Level in the way', ob.name + ' is ' + dR.toFixed(1) + 'R away in your direction, so the 2R target may stall there'); }
  if (ctx.stale) add(30, 'Stale data', 'The last candle is old: the market may be closed or the feed has stalled');
  else if (ctx.dataOld) add(20, 'Old data', 'Not refreshed recently, so the price shown may have moved');
  if (!a.spreadReal) add(5, 'Assumed spread', 'No live bid/ask on this data source, so the spread is an assumption');
  const p = tradePlan(a, { equity: ctx.equity, riskPct: ctx.riskPct, stopMult: ctx.stopMult }, dir);
  const lev = ctx.equity > 0 ? p.notional / ctx.equity : 0;
  add(lev > 10 ? 15 : lev > 5 ? 8 : 0, 'Large position', 'Position value is ' + lev.toFixed(1) + 'x your equity at this size');
  f.sort((x, y) => y.pts - x.pts);
  const score = Math.min(100, f.reduce((t, x) => t + x.pts, 0));
  const level = score < 25 ? 'Low' : score < 45 ? 'Moderate' : score < 65 ? 'High' : 'Very high';
  // Win rate needed to break even with a +2R target, -1R stop, and the spread cost (as a share of R) paid on every trade
  return { score, level, factors: f, cost, leverage: lev, breakevenWin: (1 + cost) / 3 };
}

const sizeFactor = (level) => level === 'Low' ? 1 : level === 'Moderate' ? 0.75 : level === 'High' ? 0.5 : 0;
const streakLoss = (riskPct, n) => (1 - Math.pow(1 - riskPct / 100, n)) * 100;

// Why a market is NOT a candidate right now (most informative reason first)
function blockers(a, f, minScore) {
  const b = [];
  if (!a.entryType) b.push(a.setup === 'No setup' ? 'No entry setup right now' : 'No entry setup (' + a.setup.toLowerCase() + ')');
  else if (Math.sign(a.lean) !== a.dir) b.push(a.setup + ' found, but the lean points the other way (' + a.lean + ')');
  else if (Math.abs(a.lean) < minScore) b.push(a.setup + ' found, but lean ' + a.lean + ' is below your minimum of ' + minScore);
  if (f.stale) b.push('Data is stale: market closed or feed stalled');
  if (f.dataOld) b.push('Data is old: press Update data');
  if (f.event) b.push('Inside an event no-trade window');
  if (f.wide) b.push('Spread is over 25% of an ATR');
  if (!f.core) b.push('Outside this market\'s core session hours');
  return b;
}

// Plain-English reasons behind a setup
function explain(a, dir) {
  const out = [];
  out.push(a.regime === 'Trend' ? 'Trending market (ADX ' + a.adx.toFixed(0) + ') with EMA20 ' + (a.ema20 > a.ema50 ? 'above' : 'below') + ' EMA50'
    : a.regime === 'Range' ? 'Range-bound market (ADX ' + a.adx.toFixed(0) + '), where stretches tend to get faded'
    : 'Transitional market (ADX ' + a.adx.toFixed(0) + '), neither clearly trending nor ranging');
  out.push('Price is ' + Math.abs(a.dev).toFixed(1) + ' ATR ' + (a.dev >= 0 ? 'above' : 'below') + ' VWAP, RSI ' + a.rsi.toFixed(0) + (a.rsi >= 70 ? ' (overbought)' : a.rsi <= 30 ? ' (oversold)' : ''));
  if (a.rvol != null) out.push('Volume is running ' + a.rvol.toFixed(1) + 'x normal for this time of day');
  const ob = nearestObstacle(a, dir);
  if (ob) out.push('Nearest level in your direction: ' + ob.name + ' at ' + ob.v.toFixed(a.price >= 100 ? 2 : 3));
  else out.push('No known level stands between price and the target');
  return out;
}

// pos: [{market, dir, riskPct}]   info: { [market]: { a, risk } }   s: { equity, stopMult, dailyLossPct, leverage, eventActive }
function basketAssess(pos, s, info) {
  const nameOf = (id) => (MARKETS.find(m => m.id === id) || {}).name || id;
  const items = pos.map(p => {
    const i = info[p.market];
    if (!i) return { ...p, missing: true, name: nameOf(p.market) };
    const plan = tradePlan(i.a, { equity: s.equity, riskPct: p.riskPct, stopMult: s.stopMult }, p.dir);
    return { ...p, name: nameOf(p.market), plan, level: i.risk.level, riskScore: i.risk.score };
  });
  const ok = items.filter(x => !x.missing);
  const totalRiskPct = ok.reduce((t, x) => t + x.riskPct, 0);
  const totalRisk = s.equity * totalRiskPct / 100;
  const notional = ok.reduce((t, x) => t + x.plan.notional, 0);
  const lev = s.equity > 0 ? notional / s.equity : 0;
  const margin = notional / Math.max(1, s.leverage);
  const marginPct = s.equity > 0 ? margin / s.equity * 100 : 0;
  const clusters = {};
  for (const x of ok) {
    const k = CLUSTERS[x.market] || x.market;
    const c = clusters[k] || (clusters[k] = { name: k, long: 0, short: 0, n: 0 });
    c[x.dir > 0 ? 'long' : 'short'] += x.riskPct; c.n++;
  }
  const clusterList = Object.values(clusters).map(c => ({ ...c, net: Math.abs(c.long - c.short) }));
  const findings = [];
  let sev = 0;
  const flag = (lvl, text) => { findings.push({ lvl, text }); sev = Math.max(sev, lvl); };

  const limit = s.dailyLossPct;
  const limitUse = limit > 0 ? totalRiskPct / limit * 100 : 0;
  if (limit > 0 && limitUse >= 100) flag(2, 'If every stop is hit you lose ' + totalRiskPct.toFixed(2) + '% of equity, which reaches or breaches your ' + limit + '% daily limit.');
  else if (limit > 0 && limitUse >= 70) flag(1, 'If every stop is hit you lose ' + totalRiskPct.toFixed(2) + '%, using ' + limitUse.toFixed(0) + '% of your ' + limit + '% daily limit.');
  else flag(0, 'If every stop is hit you lose ' + totalRiskPct.toFixed(2) + '% of equity, inside your ' + limit + '% daily limit.');

  for (const c of clusterList) {
    if ((c.long > 0 && c.short === 0 && c.n > 1) || (c.short > 0 && c.long === 0 && c.n > 1))
      flag(1, 'Several ' + (c.long > 0 ? 'long' : 'short') + ' positions in ' + c.name + ' move together, so treat them as one bet of about ' + c.net.toFixed(2) + '% risk.');
  }
  if (marginPct > 80) flag(2, 'Estimated margin use is ' + marginPct.toFixed(0) + '% of equity at ' + s.leverage + ':1, leaving little buffer before a margin call.');
  else if (marginPct > 50) flag(1, 'Estimated margin use is ' + marginPct.toFixed(0) + '% of equity at ' + s.leverage + ':1.');
  for (const x of ok) {
    if (x.level === 'Very high') flag(2, x.name + ' has a very high risk rating right now (see the factors in its detail panel).');
    else if (x.level === 'High') flag(1, x.name + ' has a high risk rating right now.');
  }
  for (const x of items) if (x.missing) flag(1, x.name + ' has no live data, so it is left out of these numbers.');
  if (s.eventActive) flag(2, 'You are inside an event no-trade window.');

  return { items, totalRiskPct, totalRisk, notional, lev, margin, marginPct, clusterList, limitUse, stress: totalRiskPct * 2, findings, severity: sev };
}

/* ---------- V1-style 5-tier signal, built on the v2 lean ----------
   Buy = go long, Sell = go short (these are CFDs, so Sell means a short, not just "avoid").
   A "Strong" label needs the lean (60+) AND a ready, aligned setup that passed the risk checks.
   Otherwise a strong lean is capped at Moderate, so a label never promises more than the checks support. */
function signalLabel(a, eligible) {
  const lean = a.lean;
  let tier = lean >= 60 ? 2 : lean >= 30 ? 1 : lean <= -60 ? -2 : lean <= -30 ? -1 : 0;
  let note = 'Lean ' + lean + ' (Strong needs 60+ with a ready setup; Moderate needs 30+)';
  if (Math.abs(tier) === 2 && !(eligible && a.actionable && a.dir === Math.sign(tier))) {
    tier = Math.sign(tier);
    note = 'Lean ' + lean + ' is strong, but there is no ready, aligned, acceptable-risk setup behind it, so it is capped at Moderate';
  }
  const label = tier === 2 ? 'Strong Buy' : tier === 1 ? 'Moderate Buy' : tier === 0 ? 'Hold' : tier === -1 ? 'Moderate Sell' : 'Strong Sell';
  return { tier, label, note, cls: tier > 0 ? 'up' : tier < 0 ? 'down' : 'muted', strong: Math.abs(tier) === 2 };
}

const HORIZONS = {

const RESEARCH_SCHEMA = {

  rating: 'Buy | Hold | Sell', confidence: 'low | medium | high',
  technical: { trend: 'text', rsi: 'number or null', support: 'text', resistance: 'text', range52w: 'text', summary: 'text' },

function buildPrompt(tickers, horizonText, todayStr) {
  const list = [].concat(tickers);
  const multi = list.length > 1;
  return [
    'Today is ' + todayStr + '. Research ' + (multi ? 'each of these stock tickers: ' + list.join(', ') : 'the stock ticker ' + list[0]) + ' using web search and give me a research view for this horizon: ' + horizonText + '.',
    '',

    '- The rating (Buy, Hold or Sell) must agree with the scenarios and the evidence. Say plainly where technicals and sentiment disagree.',
    '- Keep every text field to one or two sentences. Do not give personal advice.',

          : 'Reply with ONLY one JSON object, with no markdown fences and no text before or after it, in exactly this shape:',
    JSON.stringify(RESEARCH_SCHEMA, null, 1)
  ].join('\n');
}

function extractJson(text) {
  const t = String(text || '').replace(/```(?:json)?/gi, '').trim();
  try { return JSON.parse(t); } catch (e) { /* fall through to slicing */ }
  const oi = t.indexOf('{'), ai = t.indexOf('[');
  const useArr = ai !== -1 && (oi === -1 || ai < oi);
  const a = useArr ? ai : oi, b = useArr ? t.lastIndexOf(']') : t.lastIndexOf('}');
  if (a === -1 || b <= a) throw new Error('No JSON found in the output');
  return JSON.parse(t.slice(a, b + 1));
}

function normalizeResearch(o, tickerFallback) {
  if (!o || typeof o !== 'object' || Array.isArray(o)) throw new Error('The research output was not a JSON object');
  const num = (x) => { if (x == null || x === '') return null; const n = typeof x === 'number' ? x : parseFloat(String(x).replace(/[$,\s]/g, '')); return isFinite(n) ? n : null; };
  const str = (x) => x == null ? '' : String(x).slice(0, 500);
  const arr = (x) => Array.isArray(x) ? x.map(str).filter(Boolean).slice(0, 8) : [];
  const price = num(o.price);
  if (!price || price <= 0) throw new Error('No usable current price in the research output');
  const sc = o.scenarios || {};
  const scen = (k) => { const x = sc[k] || {}; return { price: num(x.price), timeframe: str(x.timeframe), assumption: str(x.assumption) }; };
  const bull = scen('bull'), base = scen('base'), bear = scen('bear');
  if ([bull, base, bear].some(x => x.price == null || x.price <= 0)) throw new Error('A bull, base or bear scenario price is missing');
  const rating = ['Buy', 'Hold', 'Sell'].includes(o.rating) ? o.rating : 'Hold';
  const confidence = ['low', 'medium', 'high'].includes(String(o.confidence).toLowerCase()) ? String(o.confidence).toLowerCase() : 'low';
  const t = o.technical || {}, se = o.sentiment || {}, f = o.fundamentals || {};
  const sources = Array.isArray(o.sources) ? o.sources.filter(x => x && typeof x.url === 'string' && /^https?:\/\//i.test(x.url)).slice(0, 8).map(x => ({ title: str(x.title) || x.url, url: x.url })) : [];
  const warnings = [];
  if (!(bull.price >= base.price && base.price >= bear.price)) warnings.push('Scenario prices are out of order (bull should be at least base, and base at least bear).');
  if (rating === 'Buy' && base.price < price) warnings.push('Rated Buy, but the base case is below the current price.');
  if (rating === 'Sell' && base.price > price) warnings.push('Rated Sell, but the base case is above the current price.');
  if ([bull, base, bear].some(x => x.price > price * 5 || x.price < price / 5)) warnings.push('A scenario price is more than 5x away from the current price. Check the units or currency.');
  if (!sources.length) warnings.push('No sources were listed, so treat the figures as unverified.');
  return {
    ticker: String(o.ticker || tickerFallback || 'UNKNOWN').toUpperCase().slice(0, 12), name: str(o.name), currency: str(o.currency).slice(0, 6),
    price, priceDate: str(o.priceDate).slice(0, 20), rating, confidence,
    technical: { trend: str(t.trend), rsi: num(t.rsi), support: str(t.support), resistance: str(t.resistance), range52w: str(t.range52w), summary: str(t.summary) },
    sentiment: { newsTone: str(se.newsTone), analystConsensus: str(se.analystConsensus), targetLow: num(se.targetLow), targetMean: num(se.targetMean), targetHigh: num(se.targetHigh), summary: str(se.summary) },
    fundamentals: { valuation: str(f.valuation), nextEarnings: str(f.nextEarnings), summary: str(f.summary) },
    agreement: str(o.agreement), scenarios: { bull, base, bear }, catalysts: arr(o.catalysts), risks: arr(o.risks), sources, warnings,
    fetchedAt: Date.now()
  };
}

function scenarioStats(r) {
  const pct = (p) => (p / r.price - 1) * 100;
  const up = r.scenarios.bull.price - r.price, down = r.price - r.scenarios.bear.price;
  return { bull: pct(r.scenarios.bull.price), base: pct(r.scenarios.base.price), bear: pct(r.scenarios.bear.price), rr: down > 0 ? up / down : null };
}

/* ---------- Stock Tracker (eToro 24/5 tickers) ---------- */
const TRACKER_DEFAULT_SYMBOLS = ['NVDA', 'AMD', 'SNDK', 'SPCX', 'INTC', 'PLTR', 'GOOG', 'IOND', 'ANT.24-7', 'MU', 'ALAB', 'NBIS', 'Coffee.FUT', 'COCOA.FUT', 'ZINC', 'PLATINUM'];

// eToro's "24-7" instruments (for example ANT.24-7) also trade through the weekend
const is247 = (sym, name) => /24[-\/]7/i.test(String(sym || '') + ' ' + String(name || ''));

function parseSymbols(text) {
  return [...new Set(String(text || '').toUpperCase().split(/[\s,;]+/).filter(Boolean))].slice(0, 40);
}

function normalizeBase(u) {
  let b = String(u || '').trim();
  if (!b) return '';
  if (!/^https?:\/\//i.test(b)) b = 'https://' + b;
  return b.replace(/\/+$/, '');
}

function nyMinutes(t) {
  const p = cachedDtf('nyhm', 'America/New_York', { hourCycle: 'h23', hour: '2-digit', minute: '2-digit' }).formatToParts(new Date(t)).reduce((o, x) => (o[x.type] = x.value, o), {});
  return +p.hour * 60 + +p.minute;
}

// Which part of the eToro 24/5 week it is. Pre-market 04:00, regular 09:30 to 16:00, after-hours to 20:00, then overnight (New York time).
function usSessionLabel(nowMs) {
  const p = cachedDtf('nywd', 'America/New_York', { weekday: 'short', hourCycle: 'h23', hour: '2-digit', minute: '2-digit' }).formatToParts(new Date(nowMs)).reduce((o, x) => (o[x.type] = x.value, o), {});
  const mins = +p.hour * 60 + +p.minute, wd = p.weekday;
  if (wd === 'Sat' || (wd === 'Fri' && mins >= 1200) || (wd === 'Sun' && mins < 1200)) return 'Weekend';   // 24/5: Sunday 20:00 to Friday 20:00
  if (mins >= 570 && mins < 960) return 'Regular';
  if (mins >= 240 && mins < 570) return 'Pre-market';
  if (mins >= 960 && mins < 1200) return 'After-hours';
  return 'Overnight';
}

// Close of the last regular-hours candle (09:30 to 16:00 New York) before after-hours began. null if there is none in the data.
// Early-close days (such as the day after Thanksgiving) are not detected, so the normal 16:00 close is used on those days.
function lastRegularClose(candles) {
  const inReg = (t) => { const m = nyMinutes(t); return m >= 570 && m < 960; };
  let next = candles.length ? inReg(candles[candles.length - 1].t) : false;
  for (let i = candles.length - 2; i >= 0; i--) {
    const cur = inReg(candles[i].t);
    if (cur && !next) return candles[i].c;
    next = cur;
  }
  return null;
}

// data = the Worker's reply { name, type, exchange, candles: [[t,o,h,l,c,v], ...] }, oldest first
function buildTrackerEntry(sym, data, s, spreadPct, nowMs) {
  const candles = (data.candles || []).map(c => ({ t: c[0], o: c[1], h: c[2], l: c[3], c: c[4], v: c[5] || 0, bid: null, ask: null }));
  if (!candles.length) return { symbol: sym, name: data.name, type: data.type, error: 'eToro returned no candles' };
  const last = candles[candles.length - 1];
  const a = analyze(candles, { gran: 'M15', rolloverUtc: s.rolloverUtc, minScore: s.minScore }, last.c * spreadPct / 100, nowMs);
  if (a.error) return { symbol: sym, name: data.name, type: data.type, error: a.error };
  const isStock = /stock/i.test(data.type || '');
  const hi = Math.max(...candles.map(c => c.h));
  return {
    symbol: sym, name: data.name || sym, type: data.type || '', exchange: data.exchange || '', a, isStock, is247: is247(sym, data.name),
    refClose: isStock ? lastRegularClose(candles) : a.pdc,            // stocks: last regular close; others: prior trading day's close
    dipPct: (a.price / hi - 1) * 100, windowHigh: hi, windowDays: (last.t - candles[0].t) / 86400000, fetchedAt: nowMs
  };
}

// ctx: { equity, riskPct, stopMult, eventActive, eventMinutes }
function buildTrackerRow(e, ctx, nowMs) {
  const a = e.a;
  const stale = nowMs - a.lastT > 45 * 60000;                        // 3 candles of 15 minutes
  const dataOld = nowMs - e.fetchedAt > 180000;
  const wide = a.spread > 0.25 * a.atr;
  const core = e.isStock ? sessionInfo('ny', nowMs).isOpen : true;   // regular US hours are "core"; overnight trading is thinner
  const tradeable = a.actionable && !stale && !dataOld && !wide && !ctx.eventActive;
  const dir = a.dir || (a.lean >= 0 ? 1 : -1);
  const risk = riskAssess(a, dir, { core, stale, dataOld, eventActive: ctx.eventActive, eventMinutes: ctx.eventMinutes, weekendGap: isWeekendGapRisk(nowMs) && !e.is247, equity: ctx.equity, riskPct: ctx.riskPct, stopMult: ctx.stopMult });
  const sig = signalLabel(a, tradeable && risk.level !== 'Very high');
  const base = e.isStock ? usSessionLabel(nowMs) : (stale ? 'Closed' : 'Open');
  return { ...e, stale, dataOld, wide, core, tradeable, risk, sig, dir,
    session: e.is247 ? (stale ? 'Closed' : base === 'Weekend' ? 'Weekend (open)' : base) : base,   // 24/7 instruments keep trading at the weekend
    chgPct: e.refClose ? (a.price / e.refClose - 1) * 100 : null };
}

/* ---------- Long-term buys: technical analysis on daily candles ----------
   Nothing here predicts the future. It measures how volatile and how trending a stock has been, turns that into
   scenario ranges, finds support levels, and applies stated rules to suggest a buy zone. */
const LT_DEFAULT_SYMBOLS = ['NVDA', 'AMD', 'SNDK', 'SPCX', 'INTC', 'PLTR', 'GOOG', 'IOND', 'ANT.24-7', 'MU', 'ALAB', 'NBIS'];
const LT_HORIZONS = [6, 12, 24];                        // months
const LT_PATHS = 4000;                                  // simulated price paths per stock

const ltFmt = (n) => n == null || !isFinite(n) ? '-' : Math.abs(n) >= 1000 ? n.toFixed(0) : Math.abs(n) >= 100 ? n.toFixed(1) : n.toFixed(2);
const ltPctText = (x, d = 0) => (x >= 0 ? '+' : '') + (x * 100).toFixed(d) + '%';
const ltMean = (v) => v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0;
const ltStd = (v) => { if (v.length < 2) return 0; const m = ltMean(v); return Math.sqrt(v.reduce((a, b) => a + (b - m) * (b - m), 0) / (v.length - 1)); };

function ltSma(v, n, end) {
  if (end == null) end = v.length - 1;
  if (n < 1 || end - n + 1 < 0) return null;
  let s = 0;
  for (let i = end - n + 1; i <= end; i++) s += v[i];
  return s / n;
}

// Weeks start on Monday (UTC). Returns weekly candles.
function ltWeekly(candles) {
  const wk = (t) => Math.floor((t - 4 * 86400000) / (7 * 86400000));
  const out = [];
  let key = null;
  for (const c of candles) {
    const k = wk(c.t);
    if (k !== key) { out.push({ t: c.t, o: c.o, h: c.h, l: c.l, c: c.c, v: c.v || 0 }); key = k; }
    else { const w = out[out.length - 1]; w.h = Math.max(w.h, c.h); w.l = Math.min(w.l, c.l); w.c = c.c; w.v += c.v || 0; }
  }
  return out;
}

// Swing highs and lows on weekly candles: a pivot beats the k weeks on each side of it
function ltPivots(weekly, k = 3) {
  const highs = [], lows = [];
  for (let i = k; i < weekly.length - k; i++) {
    let isH = true, isL = true;
    for (let j = 1; j <= k; j++) {
      if (!(weekly[i].h > weekly[i - j].h && weekly[i].h > weekly[i + j].h)) isH = false;
      if (!(weekly[i].l < weekly[i - j].l && weekly[i].l < weekly[i + j].l)) isL = false;
    }
    if (isH) highs.push({ price: weekly[i].h, idx: i });
    if (isL) lows.push({ price: weekly[i].l, idx: i });
  }
  return { highs, lows };
}

// Merge nearby price points into one level that remembers how many times price turned there
function ltCluster(points, tol = 0.03) {
  const sorted = [...points].sort((a, b) => a.price - b.price);
  const out = [];
  let group = [];
  const flush = () => { if (group.length) out.push({ price: ltMean(group.map(g => g.price)), touches: group.length, last: Math.max(...group.map(g => g.idx)) }); group = []; };
  for (const p of sorted) {
    if (group.length && p.price > group[0].price * (1 + tol)) flush();
    group.push(p);
  }
  flush();
  return out;
}

function ltRng(seed) {
  let a = seed >>> 0;
  return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function ltHash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function ltPct(sorted, q) {
  if (!sorted.length) return NaN;
  const pos = (sorted.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
}

/* Simulate price paths with a steady volatility and either no drift (neutral) or a trend drift.
   Both use the same random numbers, so the only difference between them is the trend.
   sigma: annual volatility, g: annual log drift for the trend scenario, T: years, steps: price points along the way. */
function ltSimulate(price, sigma, g, T, steps, paths, seed) {
  const rng = ltRng(seed);
  const dt = T / steps, sd = sigma * Math.sqrt(dt), gd = g * dt;
  const minN = new Float64Array(paths), maxN = new Float64Array(paths), finN = new Float64Array(paths);
  const minT = new Float64Array(paths), maxT = new Float64Array(paths), finT = new Float64Array(paths);
  let spare = null;
  const normal = () => {
    if (spare !== null) { const s = spare; spare = null; return s; }
    let u = 0; while (u === 0) u = rng();
    const v = rng(), r = Math.sqrt(-2 * Math.log(u));
    spare = r * Math.sin(2 * Math.PI * v);
    return r * Math.cos(2 * Math.PI * v);
  };
  for (let p = 0; p < paths; p++) {
    let x = 0, mnX = 0, mxX = 0, mnY = 0, mxY = 0, y = 0;
    for (let k = 1; k <= steps; k++) {
      x += sd * normal();
      y = x + gd * k;
      if (x < mnX) mnX = x; if (x > mxX) mxX = x;
      if (y < mnY) mnY = y; if (y > mxY) mxY = y;
    }
    minN[p] = mnX; maxN[p] = mxX; finN[p] = x; minT[p] = mnY; maxT[p] = mxY; finT[p] = y;
  }
  const summarise = (mn, mx, fin) => {
    const a = Array.from(mn).sort((p, q) => p - q), b = Array.from(mx).sort((p, q) => p - q), f = Array.from(fin).sort((p, q) => p - q);
    const px = (v) => price * Math.exp(v);
    return {
      lowTypical: px(ltPct(a, 0.5)), lowBad: px(ltPct(a, 0.1)),             // typical path low, and a low only 1 year in 10 goes below
      highTypical: px(ltPct(b, 0.5)), highGood: px(ltPct(b, 0.9)),          // typical path high, and a high only 1 year in 10 goes above
      final: { p10: px(ltPct(f, 0.1)), p50: px(ltPct(f, 0.5)), p90: px(ltPct(f, 0.9)) }
    };
  };
  return { neutral: summarise(minN, maxN, finN), trend: summarise(minT, maxT, finT) };
}

/* Rating rules, kept separate so they can be tested on their own.
   in: { enough, downtrend, trendScore, price, buy1, rr } */
function ltRate(i) {
  if (!i.enough) return { rating: 'Not enough history', why: 'There is less than about a year of daily history, so the long-term averages and levels cannot be trusted yet.' };
  if (i.downtrend) return { rating: 'Avoid for now', why: 'The price is below a falling 200-day average. Buying into a downtrend is catching a falling knife, so wait for the price to climb back above it.' };
  if (i.trendScore < 35) return { rating: 'Wait', why: 'The long-term trend is mixed, not clearly up. Wait for a clearer trend.' };
  if (i.price <= i.buy1 * 1.02) {
    if (i.rr != null && i.rr < 1.5) return { rating: 'Wait', why: 'The price is in the buy zone, but the typical upside is less than 1.5 times the risk to the invalidation price.' };
    return { rating: 'Buy now', why: 'The trend is healthy and the price is at or near the suggested buy price.' };
  }
  return { rating: 'Accumulate on dips', why: 'The trend is healthy but the price is above the buy zone. Consider buying in steps if it pulls back to the buy price.' };
}

function ltAnalyse(candles, opts) {
  const sym = (opts && opts.symbol) || '', horizonMonths = (opts && opts.horizonMonths) || 12, nowMs = (opts && opts.nowMs) || Date.now();
  const clean = (candles || []).filter(c => [c.t, c.o, c.h, c.l, c.c].every(isFinite) && c.c > 0 && c.h > 0 && c.l > 0);
  const n = clean.length;
  if (n < 60) return { symbol: sym, n, error: 'Only ' + n + ' daily candles so far. Long-term analysis needs at least 60, and about a year for the full picture.' };

  const closes = clean.map(c => c.c), highs = clean.map(c => c.h), lows = clean.map(c => c.l);
  const price = closes[n - 1], lastT = clean[n - 1].t;
  const years = Math.max((lastT - clean[0].t) / (365.25 * 86400000), 1 / 52);
  const perYear = Math.min(366, Math.max(150, (n - 1) / years));            // about 252 for weekday data, about 365 for 24/7 data
  const yearN = Math.min(n, Math.round(perYear)), qtrN = Math.min(n, Math.round(perYear / 4));
  const enough = n >= 200 + 60 && years >= 0.9;
  const warnings = [], reasons = [];

  // volatility
  const rets = [];
  for (let i = 1; i < n; i++) rets.push(Math.log(closes[i] / closes[i - 1]));
  const vol1y = ltStd(rets.slice(-yearN)) * Math.sqrt(perYear), vol3m = ltStd(rets.slice(-qtrN)) * Math.sqrt(perYear);
  const sigma = Math.max(0.05, Math.sqrt(0.6 * vol1y * vol1y + 0.4 * vol3m * vol3m));

  // trend, averages, momentum
  const sma50 = ltSma(closes, 50), sma100 = ltSma(closes, 100), sma200 = ltSma(closes, 200);
  const sma200Prev = n >= 260 ? ltSma(closes, 200, n - 1 - 60) : null;
  const slope200 = sma200 != null && sma200Prev != null ? sma200 / sma200Prev - 1 : null;       // change in the 200-day average over 60 candles
  const ret = (k) => n - 1 - k >= 0 ? price / closes[n - 1 - k] - 1 : null;
  const r3m = ret(Math.round(perYear / 4)), r6m = ret(Math.round(perYear / 2)), r12m = ret(Math.round(perYear));
  const high52 = Math.max(...highs.slice(-yearN)), low52 = Math.min(...lows.slice(-yearN));
  const weekly = ltWeekly(clean);
  const rsiD = rsiWilder(closes, 14), rsiW = weekly.length > 15 ? rsiWilder(weekly.map(w => w.c), 14) : null;
  const atrW = weekly.length > 15 ? atrWilder(weekly, 14) : null;
  const weeklyRange = atrW != null && atrW > 0 ? atrW : price * sigma / Math.sqrt(52);
  let peak = closes[0], maxDD = 0;
  for (const c of closes) { if (c > peak) peak = c; maxDD = Math.min(maxDD, c / peak - 1); }
  const ddNow = price / high52 - 1;

  // trend score, -100 to +100
  let score = 0;
  const add = (cond, pts) => { if (cond === true) score += pts; else if (cond === false) score -= pts; };
  if (sma200 != null) { add(price > sma200, 25); add(sma50 > sma200, 15); }
  if (slope200 != null) add(slope200 > 0, 15);
  if (r12m != null) add(r12m > 0, 15);
  if (r6m != null) add(r6m > 0, 10);
  if (rsiW != null) { if (rsiW >= 45 && rsiW <= 75) score += 10; else if (rsiW < 40) score -= 10; }
  if (ddNow >= -0.2) score += 10; else if (ddNow <= -0.4) score -= 10;
  score = Math.max(-100, Math.min(100, score));
  const trendLabel = score >= 70 ? 'Strong uptrend' : score >= 35 ? 'Uptrend' : score > -35 ? 'Mixed or sideways' : score > -70 ? 'Downtrend' : 'Strong downtrend';
  const downtrend = sma200 != null && price < sma200 && slope200 != null && slope200 < 0;

  // support and resistance from weekly swings, plus the usual long-term levels
  const piv = ltPivots(weekly, 3);
  const clusters = ltCluster([...piv.highs, ...piv.lows], 0.03).filter(c => c.price >= price * 0.5 && c.price <= price * 1.6);
  const levelsBelow = clusters.filter(c => c.price < price * 0.995).map(c => ({ price: c.price, label: 'Weekly turning point (' + c.touches + (c.touches === 1 ? ' touch' : ' touches') + ')', strength: Math.min(3, c.touches) }));
  const levelsAbove = clusters.filter(c => c.price > price * 1.005).map(c => ({ price: c.price, label: 'Resistance (' + c.touches + (c.touches === 1 ? ' touch' : ' touches') + ')', strength: Math.min(3, c.touches) }));
  const sma50w = weekly.length >= 50 ? ltSma(weekly.map(w => w.c), 50) : null;
  const extra = [];
  if (sma200 != null && sma200 < price * 0.995) extra.push({ price: sma200, label: '200-day average', strength: 3 });
  if (sma50w != null && sma50w < price * 0.995) extra.push({ price: sma50w, label: '50-week average', strength: 2 });
  if (low52 < price * 0.995) extra.push({ price: low52, label: '52-week low', strength: 2 });
  // Fibonacci pullback levels of the last big up-leg (the low must come before the high, and the leg must be at least 25%)
  const fibN = Math.min(n, Math.round(perYear * 2)), hs = highs.slice(-fibN), ls = lows.slice(-fibN);
  const iH = hs.indexOf(Math.max(...hs)), iL = ls.indexOf(Math.min(...ls));
  let fib = null;
  if (iL < iH && hs[iH] / ls[iL] >= 1.25) {
    const H = hs[iH], L = ls[iL];
    fib = { high: H, low: L, f382: H - 0.382 * (H - L), f50: H - 0.5 * (H - L), f618: H - 0.618 * (H - L) };
    if (fib.f50 < price * 0.995) extra.push({ price: fib.f50, label: '50% pullback of the last big rise', strength: 2 });
    if (fib.f618 < price * 0.995) extra.push({ price: fib.f618, label: '61.8% pullback of the last big rise', strength: 2 });
  }
  const supports = [...levelsBelow, ...extra].sort((a, b) => b.price - a.price);

  // projected range
  const T = horizonMonths / 12, steps = Math.max(20, Math.min(600, Math.round(T * perYear)));
  const m = Math.min(n, Math.round(perYear)), lx = [];
  for (let i = n - m; i < n; i++) lx.push(Math.log(closes[i]));
  const xs = lx.map((_, i) => i), xm = ltMean(xs), ym = ltMean(lx);
  let sxy = 0, sxx = 0;
  for (let i = 0; i < m; i++) { sxy += (xs[i] - xm) * (lx[i] - ym); sxx += (xs[i] - xm) * (xs[i] - xm); }
  const trendDrift = sxx > 0 ? (sxy / sxx) * perYear : 0;                       // how fast ln(price) has been rising per year
  const g = Math.max(-0.30, Math.min(0.30, 0.5 * trendDrift));                   // half of that, capped at +/-30% a year
  const sim = ltSimulate(price, sigma, g, T, steps, LT_PATHS, ltHash(sym + '|' + lastT + '|' + horizonMonths));
  const proj = sim.trend;

  // suggested buy prices
  const lowFloor = proj.lowTypical * 0.97;
  const usable = supports.filter(s => s.price >= Math.max(lowFloor, price * 0.5) && s.price <= price * 0.995);
  const strong = usable.filter(s => s.strength >= 2);
  let b1;
  if (strong.length) b1 = { price: strong[0].price, label: strong[0].label };
  else if (usable.length) b1 = { price: usable[0].price, label: usable[0].label };
  else if (proj.lowTypical < price * 0.995) b1 = { price: proj.lowTypical, label: 'Typical low of the projected range' };
  else b1 = { price: price * 0.95, label: '5% below the current price' };
  const deeper = supports.filter(s => s.price <= b1.price * 0.95 && s.price >= price * 0.5);
  const b2 = deeper.length ? { price: deeper[0].price, label: deeper[0].label } : { price: b1.price * 0.92, label: '8% below the first buy price' };
  const invalidation = Math.max(b2.price - weeklyRange, b2.price * 0.7);
  const rr = b1.price - invalidation > 0 ? (proj.highTypical - b1.price) / (b1.price - invalidation) : null;

  const verdict = ltRate({ enough, downtrend, trendScore: score, price, buy1: b1.price, rr });

  // plain-English reasons and warnings
  if (sma200 != null) reasons.push('Price is ' + ltPctText(price / sma200 - 1) + ' ' + (price >= sma200 ? 'above' : 'below') + ' its 200-day average' + (slope200 != null ? ', which is ' + (slope200 >= 0 ? 'rising' : 'falling') : '') + '.');
  if (r12m != null) reasons.push('It is ' + ltPctText(r12m) + ' over 12 months' + (r6m != null ? ' and ' + ltPctText(r6m) + ' over 6 months' : '') + '.');
  reasons.push('It sits ' + ltPctText(ddNow) + ' from its 52-week high, and has fallen as much as ' + ltPctText(maxDD) + ' from a peak in the data.');
  reasons.push('Volatility is about ' + (sigma * 100).toFixed(0) + '% a year, so a ' + horizonMonths + '-month range is wide.');
  reasons.push('First buy price ' + ltFmt(b1.price) + ': ' + b1.label.toLowerCase() + '. Second, deeper price ' + ltFmt(b2.price) + ': ' + b2.label.toLowerCase() + '.');
  if (!enough) warnings.push('Less than about a year of history: the 200-day average and long-term levels are limited, so treat everything here as rough.');
  if (sigma > 0.6) warnings.push('Very volatile (about ' + (sigma * 100).toFixed(0) + '% a year): prices can swing far outside these ranges.');
  if (sma200 != null && price / sma200 > 1.35) warnings.push('Extended: the price is ' + ltPctText(price / sma200 - 1) + ' above its 200-day average, so a pullback is common.');
  if (ddNow <= -0.4) warnings.push('Deep drawdown: the price is ' + ltPctText(ddNow) + ' from its 52-week high.');
  if (nowMs - lastT > 6 * 86400000) warnings.push('The newest daily candle is ' + Math.round((nowMs - lastT) / 86400000) + ' days old.');

  // a thinned price history for the chart (about two years, at most ~260 points)
  const chartN = Math.min(n, Math.round(perYear * 2)), stepC = Math.max(1, Math.ceil(chartN / 260));
  const chart = { closes: [], sma200: [], t: [] };
  for (let i = n - chartN; i < n; i += stepC) { chart.closes.push(closes[i]); chart.sma200.push(ltSma(closes, 200, i)); chart.t.push(clean[i].t); }
  if ((n - chartN) % stepC !== 0 || chart.t[chart.t.length - 1] !== lastT) { chart.closes.push(price); chart.sma200.push(sma200); chart.t.push(lastT); }

  return {
    symbol: sym, n, perYear, years, price, lastT, enough, horizonMonths,
    sma50, sma100, sma200, sma50w, slope200, r3m, r6m, r12m, rsiD, rsiW, high52, low52, maxDD, ddNow,
    vol: { sigma, y1: vol1y, m3: vol3m }, trend: { score, label: trendLabel, downtrend }, fib,
    supports: supports.slice(0, 6), resistances: levelsAbove.sort((a, b) => a.price - b.price).slice(0, 3),
    projection: { T, steps, g, trendDrift, trend: sim.trend, neutral: sim.neutral },
    buy: { b1, b2, invalidation, zoneHigh: b1.price, zoneLow: b2.price, distance: price / b1.price - 1, rr, weeklyRange },
    rating: verdict.rating, ratingWhy: verdict.why, reasons, warnings, chart, fetchedAt: nowMs
  };
}

// An SVG picture of the last two years, the 200-day average, the buy zone and the projected range
function ltChartSvg(r, W, H) {
  W = W || 640; H = H || 240;
  const c = r.chart, pr = r.projection.trend, b = r.buy;
  const padL = 8, padR = 62, padT = 12, padB = 18, hx = W * 0.68;
  const vals = [...c.closes, b.b2.price, b.b1.price, pr.lowTypical, pr.highTypical, pr.final.p10, pr.final.p90].filter(isFinite);
  const lo = Math.min(...vals) * 0.97, hi = Math.max(...vals) * 1.03;
  const y = (v) => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo || 1));
  const xh = (i) => padL + (hx - padL) * (i / Math.max(1, c.closes.length - 1));
  const f = (n) => n.toFixed(1);
  const line = (arr, cls) => { const pts = arr.map((v, i) => v == null ? null : f(xh(i)) + ',' + f(y(v))).filter(Boolean); return pts.length > 1 ? '<polyline class="' + cls + '" fill="none" points="' + pts.join(' ') + '"/>' : ''; };
  const xEnd = W - padR, x0 = xh(c.closes.length - 1);
  const labels = [];
  const label = (txt, yy, cls) => { labels.push({ txt, yy, cls }); return ''; };
  const drawLabels = () => {
    labels.sort((a, b) => a.yy - b.yy);
    for (let i = 1; i < labels.length; i++) if (labels[i].yy < labels[i - 1].yy + 11) labels[i].yy = labels[i - 1].yy + 11;     // keep every label readable
    return labels.map(l => '<text x="' + (xEnd + 4) + '" y="' + f(l.yy + 3) + '" class="lt-lbl ' + l.cls + '">' + l.txt + '</text>').join('');
  };
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Price history with buy zone and projected range" xmlns="http://www.w3.org/2000/svg">' +
    '<style>.lt-px{stroke:#e6ebf1;stroke-width:1.6}.lt-ma{stroke:#e0a53a;stroke-width:1.2}.lt-lbl{font:10px sans-serif;fill:#8793a2}.lt-up{fill:#3fb68b}.lt-dn{fill:#e5645f}.lt-ac{fill:#6aa7e8}</style>' +
    '<rect x="' + padL + '" y="' + f(y(b.zoneHigh)) + '" width="' + f(xEnd - padL) + '" height="' + f(Math.max(2, y(b.zoneLow) - y(b.zoneHigh))) + '" fill="#3fb68b" opacity="0.18"/>' +
    '<polygon points="' + f(x0) + ',' + f(y(r.price)) + ' ' + f(xEnd) + ',' + f(y(pr.final.p90)) + ' ' + f(xEnd) + ',' + f(y(pr.final.p10)) + '" fill="#6aa7e8" opacity="0.22"/>' +
    '<line x1="' + f(x0) + '" x2="' + f(xEnd) + '" y1="' + f(y(pr.highTypical)) + '" y2="' + f(y(pr.highTypical)) + '" stroke="#3fb68b" stroke-dasharray="4 3"/>' +
    '<line x1="' + f(x0) + '" x2="' + f(xEnd) + '" y1="' + f(y(pr.lowTypical)) + '" y2="' + f(y(pr.lowTypical)) + '" stroke="#e5645f" stroke-dasharray="4 3"/>' +
    line(c.sma200, 'lt-ma') + line(c.closes, 'lt-px') +
    '<line x1="' + padL + '" x2="' + f(xEnd) + '" y1="' + f(y(r.price)) + '" y2="' + f(y(r.price)) + '" stroke="#6aa7e8" stroke-dasharray="2 3" opacity="0.7"/>' +
    label('high ' + ltFmt(pr.highTypical), y(pr.highTypical), 'lt-up') + label('low ' + ltFmt(pr.lowTypical), y(pr.lowTypical), 'lt-dn') + label('buy ' + ltFmt(b.b1.price), y(b.zoneHigh), 'lt-up') +
    label('now ' + ltFmt(r.price), y(r.price), 'lt-ac') + drawLabels() +
    '</svg>';
}

/* ---------- Ownership activity: plain-English reading of the SEC data the Worker returns ---------- */
const secMoney = (n) => !isFinite(n) || n == null ? '-' : n >= 1e9 ? '$' + (n / 1e9).toFixed(2) + ' billion' : n >= 1e6 ? '$' + (n / 1e6).toFixed(2) + ' million' : n >= 1e3 ? '$' + (n / 1e3).toFixed(0) + 'k' : '$' + Math.round(n);
function secInsiderLines(ins) {
  const lines = [];
  if (!ins) return lines;
  const b = ins.buys, s = ins.sells;
  if (b.n === 0 && s.n === 0) lines.push('No open-market insider buying or selling in the last ' + ins.days + ' days.');
  if (b.n > 0) lines.push(b.n + ' open-market ' + (b.n === 1 ? 'purchase' : 'purchases') + ' by ' + b.people + ' ' + (b.people === 1 ? 'person' : 'people') + ' (' + secMoney(b.usd) + ').');
  if (s.n > 0) lines.push(s.n + ' open-market ' + (s.n === 1 ? 'sale' : 'sales') + ' by ' + s.people + ' ' + (s.people === 1 ? 'person' : 'people') + ' (' + secMoney(s.usd) + (s.planN > 0 && s.usd > 0 ? ', ' + Math.round(100 * s.planUsd / s.usd) + '% under pre-set 10b5-1 plans' : '') + ').');
  if (ins.clusterBuy) lines.push(ins.clusterPeople + ' different insiders bought on the open market within 30 days. In studies, buying like this has been the most informative insider pattern, though the effect is weaker for large companies.');
  else if (b.n > 0 && ins.officerBuy) lines.push('An officer or director bought with their own money. Studies find purchases more informative than sales, and the effect is mostly in smaller companies.');
  if (b.n === 0 && s.n > 0) lines.push('Only sales. Most insider selling is routine (taxes, diversification, pre-set plans) and says little about the outlook.');
  return lines;
}
function secHolderLines(holders, nowMs) {
  const lines = [];
  for (const h of holders || []) {
    const age = Math.floor((nowMs - Date.parse(h.filed)) / 86400000);
    if (h.activist && age <= 180) lines.push('A Schedule 13D was filed ' + age + ' days ago' + (h.holder ? ' by ' + h.holder : '') + (h.percent != null ? ' (' + h.percent + '%)' : '') + '. A 13D means a holder above 5% that may want to influence the company.');
  }
  return lines;
}
function secTag(d) {
  if (!d || !d.insiders) return null;
  const i = d.insiders;
  return { text: i.buys.n + ' buy' + (i.buys.n === 1 ? '' : 's') + ' \u00B7 ' + i.sells.n + ' sale' + (i.sells.n === 1 ? '' : 's'), cluster: i.clusterBuy, buying: i.buys.n > i.sells.n && i.buys.n > 0 };
}

/* ---------- data providers ---------- */
async function fetchOanda(instrument, s, count) {
  const proxy = (s.proxyUrl || '').trim();
  const base = proxy ? proxy.replace(/\/$/, '') : (s.oandaEnv === 'live' ? 'https://api-fxtrade.oanda.com' : 'https://api-fxpractice.oanda.com');
  const headers = proxy ? {} : { Authorization: 'Bearer ' + s.oandaToken.trim() };
  const url = base + '/v3/instruments/' + instrument + '/candles?granularity=' + s.gran + '&count=' + count + '&price=MBA';
  const r = await fetch(url, { headers });
  if (!r.ok) {
    const txt = await r.text().catch(() => '');
    throw new Error('OANDA ' + r.status + (txt ? ': ' + txt.slice(0, 100) : ''));
  }
  const j = await r.json();
  return (j.candles || []).filter(c => c.mid).map(c => ({
    t: Date.parse(c.time), o: +c.mid.o, h: +c.mid.h, l: +c.mid.l, c: +c.mid.c, v: c.volume || 0,
    bid: c.bid ? +c.bid.c : null, ask: c.ask ? +c.ask.c : null
  }));
}

async function fetchTwelveData(symbol, s, count) {
  const url = 'https://api.twelvedata.com/time_series?symbol=' + encodeURIComponent(symbol) +
    '&interval=' + TD_INTERVAL[s.gran] + '&outputsize=' + count + '&timezone=UTC&order=ASC&apikey=' + encodeURIComponent(s.tdKey.trim());
  const r = await fetch(url);
  const j = await r.json();
  if (j.status === 'error' || !j.values) throw new Error('Twelve Data: ' + (j.message || 'no data').slice(0, 120));
  return j.values.map(v => ({
    t: Date.parse(v.datetime.replace(' ', 'T') + 'Z'), o: +v.open, h: +v.high, l: +v.low, c: +v.close, v: +(v.volume || 0), bid: null, ask: null
  })).sort((a, b) => a.t - b.t);
}

async function callResearch(ticker, cfg, horizonText, todayStr) {
  const messages = [{ role: 'user', content: buildPrompt(ticker, horizonText, todayStr) }];
  let text = '';
  for (let turn = 0; turn < 4; turn++) {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': cfg.apiKey.trim(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: cfg.model.trim(), max_tokens: 4000,
        tools: [{ type: 'web_search_20250305', name: 'web_search', max_uses: Math.max(1, Math.min(10, +cfg.maxSearches || 5)) }],
        messages
      })
    });
    if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error('Anthropic API ' + r.status + (t ? ': ' + t.slice(0, 160) : '')); }
    const j = await r.json();
    text = (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
    if (j.stop_reason === 'pause_turn') { messages.push({ role: 'assistant', content: j.content }); continue; }
    break;
  }
  let obj;
  try { obj = extractJson(text); } catch (e) { throw new Error('Could not read the reply as JSON. It began: ' + text.slice(0, 140)); }
  return normalizeResearch(Array.isArray(obj) ? obj[0] : obj, ticker);
}

async function trPool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const k = i++; await fn(items[k], k); } }));
}

function TrackerTab({ settings, events, now }) {

  const refresh = useCallback(async () => {

    const c = cfgRef.current;
    const base = normalizeBase(c.workerUrl);
    if (!base || !c.workerKey.trim()) { setProgress('Add your Worker address and access key in Settings first.'); setShowSettings(true); return; }
    const symbols = parseSymbols(c.symbols);
    if (!symbols.length) { setProgress('Add some tickers in Settings first.'); setShowSettings(true); return; }
    busyRef.current = true; setBusy(true);
    const st = settingsRef.current;
    let done = 0, failed = 0;
    await trPool(symbols, 3, async (sym) => {
      let entry;
      try {
        const r = await fetch(base + '/api/etoro/candles?symbol=' + encodeURIComponent(sym) + '&count=480&interval=FifteenMinutes', { headers: { 'x-access-key': c.workerKey.trim() } });
        const j = await r.json().catch(() => ({}));
        if (r.status === 401) entry = { symbol: sym, error: 'The Worker rejected the access key' };
        else if (!r.ok) entry = { symbol: sym, error: j.error || ('HTTP ' + r.status), similar: j.similar };
        else entry = buildTrackerEntry(sym, j, st, Number(c.spreadPct) || 0, Date.now());
      } catch (e) { entry = { symbol: sym, error: 'Could not reach the Worker. Check its address, and that DASHBOARD_ORIGIN on the Worker lists this website.' }; }
      done++; if (entry.error) failed++;
      setProgress('Fetched ' + done + '/' + symbols.length + ' (' + sym + ')');
      setEntries(prev => ({ ...prev, [sym]: entry }));
    });
    busyRef.current = false; setBusy(false);
    setProgress('Updated ' + (symbols.length - failed) + '/' + symbols.length + ' at ' + fmtMel(Date.now()));
  }, []);

  useEffect(() => {
    if (!cfg.auto) return;
    const i = setInterval(() => { if (!document.hidden) refresh(); }, Math.max(30, Number(cfg.refreshSec) || 60) * 1000);
    return () => clearInterval(i);
  }, [cfg.auto, cfg.refreshSec, refresh]);

  const search = async () => {
    const base = normalizeBase(cfg.workerUrl);
    if (!base || !cfg.workerKey.trim() || !q.trim()) { setFound({ error: 'Enter your Worker address, access key and something to search for.' }); return; }
    try {
      const r = await fetch(base + '/api/etoro/search?q=' + encodeURIComponent(q.trim()), { headers: { 'x-access-key': cfg.workerKey.trim() } });
      const j = await r.json().catch(() => ({}));

    } catch (e) { setFound({ error: 'Could not reach the Worker.' }); }
  };
  const addSymbol = (sym) => setCfg(c => ({ ...c, symbols: [...new Set([...parseSymbols(c.symbols), String(sym).toUpperCase()])].join('\n') }));

  const syms = useMemo(() => parseSymbols(cfg.symbols), [cfg.symbols]);
  const activeEv = events.find(e => now >= e.ts - 15 * 60000 && now <= e.ts + 5 * 60000);

  const rows = useMemo(() => {

    return syms.map(sym => { const e = entries[sym]; if (!e) return { symbol: sym, pending: true }; if (e.error) return e; return buildTrackerRow(e, ctx, now); });
  }, [syms, entries, settings.equity, settings.riskPct, settings.stopMult, !!activeEv, nextEv && nextEv.ts, now]);

  const good = rows.filter(r => r.a);
  const shown = useMemo(() => {
    const keep = rows.filter(r => filter === 'all' || (r.a && ((filter === 'buy' && r.sig.tier > 0) || (filter === 'sell' && r.sig.tier < 0) || (filter === 'dips' && r.dipPct <= -3))));
    const val = (r) => !r.a ? null : sort.key === 'symbol' ? r.symbol : sort.key === 'price' ? r.a.price : sort.key === 'chgPct' ? r.chgPct : sort.key === 'dipPct' ? r.dipPct
      : sort.key === 'rsi' ? r.a.rsi : sort.key === 'adx' ? r.a.adx : sort.key === 'lean' ? r.a.lean : sort.key === 'tier' ? r.sig.tier : null;
    return keep.sort((x, y) => {
      const a = val(x), b = val(y);
      if (a == null && b == null) return 0; if (a == null) return 1; if (b == null) return -1;
      const c = typeof a === 'string' ? a.localeCompare(b) : a - b;
      return sort.dir === 'asc' ? c : -c;

  }, [rows, filter, sort]);

  const headerClick = (key) => setSort(v => v.key === key ? { key, dir: v.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: key === 'symbol' ? 'asc' : 'desc' });

    ${activeEv && html`<div className="panel px-4 py-3 mb-3 warn" style=${{ borderColor: 'var(--warn)' }}>No-trade window: <b>${activeEv.label}</b>. Signals are held until 5 minutes after it.</div>`}

    ${good.length > 0 && html`

      <div className="panel p-3 text-sm"><div className="font-medium mb-1">Strongest signals now</div>
        ${hot.length === 0 ? html`<div className="muted">Nothing is leaning Buy or Sell right now.</div>` : hot.map(r => html`<div key=${r.symbol} className="flex items-center justify-between py-1" style=${{ cursor: 'pointer' }} onClick=${() => setSelected(r.symbol)}>
          <span><b>${r.symbol}</b> <span className="muted text-xs">${r.a.setup}</span></span><span>${sigBadge(r)} <span className="num muted text-xs">${fmtSigned(r.a.lean, 0)}</span></span></div>`)}</div>
      <div className="panel p-3 text-sm"><div className="font-medium mb-1">Deepest dips (from the recent high)</div>
        ${deep.map(r => html`<div key=${r.symbol} className="flex items-center justify-between py-1" style=${{ cursor: 'pointer' }} onClick=${() => setSelected(r.symbol)}>
          <span><b>${r.symbol}</b> <span className="muted text-xs">${r.session}</span></span><span className=${'num ' + (r.dipPct <= -5 ? 'warn' : '')}>${r.dipPct.toFixed(1)}% ${sigBadge(r)}</span></div>`)}</div>
    </div>`}

    <div className="flex flex-wrap gap-2 mb-3 items-center">
      ${filterBtn('all', 'All (' + rows.length + ')')}${filterBtn('buy', 'Buy signals')}${filterBtn('sell', 'Sell signals')}${filterBtn('dips', 'Dips of 3%+')}
      ${errCount > 0 && html`<span className="down text-sm ml-2">${errCount} ticker${errCount > 1 ? 's' : ''} with errors</span>`}

    <div className="panel overflow-x-auto mb-4">

          ${th('rsi', 'RSI', 'Wilder RSI(14) on 15-minute candles')}

          ${th('lean', 'Lean', 'Same lean score as the CFD scanner, -100 (short) to +100 (long)', 'text-center')}

        <tbody>
          ${shown.map(r => {

              <td className=${'num text-right ' + (r.chgPct == null ? 'muted' : r.chgPct >= 0 ? 'up' : 'down')}>${r.chgPct == null ? '-' : fmtSigned(r.chgPct, 2) + '%'}</td>
              <td className=${'num text-right ' + (r.dipPct <= -5 ? 'warn' : 'muted')}>${r.dipPct.toFixed(1)}%</td>
              <td className=${'num text-right ' + (a.rsi >= 70 || a.rsi <= 30 ? 'warn' : '')}>${a.rsi.toFixed(0)}</td>
              <td className="num text-right">${a.adx.toFixed(0)} <span className="muted text-xs">${a.regime}</span></td>
              <td>${leanBar(a.lean)}</td>
              <td>${sigBadge(r)}</td>
              <td>${a.entryType ? html`<span className=${'tag ' + (a.dir > 0 ? 'up' : 'down')}>${a.setup}${a.actionable ? '' : ' (weak)'}</span>` : html`<span className="muted text-xs">${a.setup}</span>`}</td>
              <td>${riskBadge(r)}</td>
              <td>${r.tradeable && html`<span className="tag up">ready</span>`}${r.stale && html`<span className="tag warn" title=${'Last candle ' + fmtAge(now - a.lastT) + ' ago'}>stale ${fmtAge(now - a.lastT)}</span>`}${r.dataOld && html`<span className="tag warn">old data</span>`}${r.wide && html`<span className="tag down">wide spread</span>`}</td>
            </tr>`;
          })}
        </tbody>
      </table>
    </div>

    ${sel && html`
    <div className="panel p-4 mb-4">
      <div className="flex flex-wrap justify-between gap-2 mb-3">
        <h2 className="text-lg font-semibold">${sel.symbol}: levels and risk <span className="muted text-sm font-normal">${trShort(sel.name)} \u00B7 ${sel.type}${sel.exchange ? ' \u00B7 ' + sel.exchange : ''}</span></h2>
        <div className="muted text-sm">ATR(15m) <span className="num text-[var(--text)]">${fmtPx(sel.a.atr)}</span> \u00B7 ${sel.windowDays.toFixed(1)} days of candles \u00B7 window high <span className="num text-[var(--text)]">${fmtPx(sel.windowHigh)}</span></div>
      </div>
      <div className="flex flex-wrap gap-6">
        <div className="flex-1 min-w-[240px]"><div className="muted text-sm mb-1">Level ladder</div>
          <table className="w-full text-sm num"><tbody>${levels(sel.a).map(x => html`<tr key=${x.l} style=${x.me ? { background: 'rgba(106,167,232,.12)' } : null}>

    </div>
  </div>`;
}
const TrackerTabMemo = React.memo(TrackerTab);
